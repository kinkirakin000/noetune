<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF7">
<title>Noetune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&family=Noto+Serif+TC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Noto Serif JP','Helvetica Neue',-apple-system,sans-serif;
  background:#FAFAF7;color:#1A1A1A;
  --ntn-font:'Noto Serif JP',serif;
}
body.lang-zh{--ntn-font:'Noto Serif TC','Noto Serif JP',serif}

.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:3rem 1.5rem 2rem;
  opacity:0;transform:translateY(18px);
  transition:opacity .5s ease,transform .5s ease;
  pointer-events:none;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.screen.active{opacity:1;transform:translateY(0);pointer-events:all}
.screen.exit{opacity:0;transform:translateY(-12px)}

.intro-title{
  font-family:'Noto Serif JP',serif;
  font-size:2.8rem;font-weight:700;letter-spacing:.15em;
  color:#1A1A1A;margin-bottom:.4rem;
}
.intro-sub{
  font-family:'Noto Serif JP',serif;
  font-size:.78rem;color:#A8A8A2;letter-spacing:.18em;
  margin-bottom:.6rem;
}
.intro-tag{
  font-family:'Noto Serif JP',serif;
  font-size:.74rem;color:#C0C0B8;letter-spacing:.14em;
  margin-bottom:2.2rem;
}

.lang-list{display:flex;flex-direction:column;gap:14px;width:100%;max-width:280px}
.lang-btn{
  padding:1.1rem 1rem;
  border-radius:18px;border:1.5px solid #E4E4DE;
  background:#fff;color:#1A1A1A;
  cursor:pointer;text-align:center;
  font-size:1.05rem;letter-spacing:.05em;
  transition:transform .15s ease,background .25s,border-color .25s,color .25s;
}
.lang-btn:active{
  transform:scale(.97);
  background:#F2F7F5;border-color:#6B9080;color:#6B9080;
}
.lang-btn.ja{font-family:'Noto Serif JP',serif}
.lang-btn.en{font-family:'Noto Serif JP','Helvetica Neue',-apple-system,sans-serif}
.lang-btn.zh{font-family:'Noto Serif TC','Noto Serif JP',serif}

.title{
  font-family:var(--ntn-font);
  font-size:1.2rem;font-weight:300;letter-spacing:.04em;
  text-align:center;line-height:1.9;
  margin-bottom:1.4rem;max-width:340px;color:#1A1A1A;
}

.text-input{
  font-family:var(--ntn-font);
  font-size:1rem;font-weight:300;text-align:center;
  border:none;border-bottom:1.5px solid #D4DDD8;
  background:transparent;padding:.7rem 1rem;
  width:92%;max-width:320px;
  outline:none;color:#1A1A1A;
  transition:border-color .3s;
}
.text-input:focus{border-bottom-color:#6B9080}
.text-input::placeholder{color:#CCC;font-weight:300}

.btn{
  font-family:var(--ntn-font);
  margin-top:2rem;padding:14px 52px;
  background:#6B9080;color:#fff;border:none;
  border-radius:30px;font-size:.95rem;letter-spacing:.08em;
  cursor:pointer;
  transition:opacity .3s,transform .15s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default}

.btn-ghost{
  font-family:var(--ntn-font);
  margin-top:.6rem;padding:10px 28px;
  background:transparent;color:#B0B0A8;
  border:none;border-radius:30px;
  font-size:.78rem;letter-spacing:.08em;
  cursor:pointer;
  transition:color .25s;
}
.btn-ghost:active{color:#6B9080}

.slider-wrap{
  width:100%;max-width:280px;
  display:flex;flex-direction:column;align-items:center;
}
input[type=range]{
  -webkit-appearance:none;appearance:none;
  width:100%;height:3px;
  background:#D4DDD8;border-radius:2px;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:32px;height:32px;
  background:#6B9080;border-radius:50%;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(107,144,128,.3);
}
input[type=range]::-moz-range-thumb{
  width:32px;height:32px;
  background:#6B9080;border-radius:50%;
  cursor:pointer;border:none;
}
.slider-labels{
  display:flex;justify-content:space-between;
  width:100%;margin-top:.6rem;
  font-size:.7rem;color:#BBB;
}

.score-num{
  font-family:var(--ntn-font);
  font-size:2.6rem;font-weight:700;
  line-height:1;margin-bottom:1.6rem;
  color:#C47A5A;letter-spacing:.02em;
}

.placeholder-line{
  font-family:var(--ntn-font);
  font-size:1.1rem;font-weight:300;
  color:#1A1A1A;text-align:center;line-height:1.9;
  letter-spacing:.04em;max-width:300px;
}

.breath-focus{
  font-family:var(--ntn-font);
  font-size:1.05rem;font-weight:300;
  color:#444;text-align:center;line-height:1.9;
  margin-bottom:1.6rem;max-width:320px;
  letter-spacing:.04em;
}
.breath-circle{
  width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#8BB5A2,#5A8A72);
  display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.92);
  font-family:var(--ntn-font);
  font-size:1.4rem;font-weight:300;letter-spacing:.05em;
  transition:transform 1.5s cubic-bezier(.4,0,.2,1),box-shadow 1.5s ease;
  box-shadow:0 4px 30px rgba(107,144,128,.15);
  user-select:none;-webkit-user-select:none;
  margin-bottom:1.6rem;
}
.breath-circle.inhale{transform:scale(1.5);box-shadow:0 8px 50px rgba(107,144,128,.25)}
.breath-circle.exhale{transform:scale(1)}
@keyframes ntn-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.breath-circle.pulse{animation:ntn-pulse 2.4s infinite}

.breath-dots{
  display:flex;gap:.55rem;margin-bottom:1.2rem;
}
.breath-dot{
  width:6px;height:6px;border-radius:50%;background:#D4DDD8;
  transition:background .25s;
}
.breath-dot.active{background:#6B9080}
.breath-dot.done{background:#A8C2B5}

.result-section{
  width:100%;max-width:320px;margin-bottom:1.6rem;
}
.result-core-label{
  font-family:var(--ntn-font);
  font-size:.65rem;letter-spacing:.22em;
  color:#A8A8A2;text-align:center;text-transform:uppercase;
  margin-bottom:.55rem;
}
.result-core-text{
  font-family:var(--ntn-font);
  font-size:1.05rem;font-weight:400;
  color:#1A1A1A;text-align:center;line-height:1.7;
  letter-spacing:.03em;
}
.result-ba-header{
  font-family:var(--ntn-font);
  font-size:.66rem;letter-spacing:.22em;
  color:#A8A8A2;text-align:center;text-transform:uppercase;
  margin-bottom:.9rem;
}
.result-row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:.85rem 0;
  border-bottom:1px solid #EDEDE7;
}
.result-row:last-child{border-bottom:none}
.result-row-label{
  font-family:var(--ntn-font);
  font-size:.85rem;color:#666;letter-spacing:.04em;
}
.result-row-values{
  font-family:var(--ntn-font);
  font-size:1.35rem;font-weight:500;
  letter-spacing:.02em;
}
.result-before{
  color:#B3B3AD;font-weight:400;
}
.result-arrow{
  color:#C8C8C2;margin:0 .4rem;font-weight:300;
}
.result-after{
  color:#1A1A1A;font-weight:600;
}
.result-msg{
  font-family:var(--ntn-font);
  font-size:.95rem;font-weight:300;
  color:#666;text-align:center;line-height:1.9;
  letter-spacing:.04em;max-width:320px;
  margin-bottom:1.2rem;
}
.result-saved{
  font-family:var(--ntn-font);
  font-size:.68rem;font-weight:300;
  color:#B8B8B0;text-align:center;
  letter-spacing:.14em;
  margin-bottom:.6rem;min-height:1em;
}

@media(max-height:640px){
  .intro-title{font-size:2.4rem}
  .screen{padding:2rem 1.2rem 1.5rem}
  .breath-circle{width:110px;height:110px}
}
</style>
</head>
<body>

<!-- ====== OPENING / LANGUAGE SELECTION ====== -->
<div class="screen active" id="s-lang">
  <div class="intro-title">Noetune</div>
  <div class="intro-sub">— a quiet practice —</div>
  <div class="intro-tag">Comfort · Good Feeling</div>
  <div class="lang-list">
    <button class="lang-btn ja" onclick="selectLang('ja')">日本語</button>
    <button class="lang-btn en" onclick="selectLang('en')">English</button>
    <button class="lang-btn zh" onclick="selectLang('zh')">繁體中文</button>
  </div>
</div>

<!-- ====== 1-1: Problem input ====== -->
<div class="screen" id="s-1-1">
  <div class="title" id="t-1-1"></div>
  <input type="text" class="text-input" id="in-1-1" autocomplete="off" oninput="updateBtn('1-1')">
  <button class="btn" id="btn-1-1" onclick="submit11()" disabled></button>
</div>

<!-- ====== 1-2: Core problem ====== -->
<div class="screen" id="s-1-2">
  <div class="title" id="t-1-2"></div>
  <input type="text" class="text-input" id="in-1-2" autocomplete="off" oninput="updateBtn('1-2')">
  <button class="btn" id="btn-1-2" onclick="submit12()" disabled></button>
  <button class="btn-ghost" id="btn-1-2-skip" onclick="submit12skip()"></button>
</div>

<!-- ====== 2-1: Initial Comfort ====== -->
<div class="screen" id="s-2-1">
  <div class="title" id="t-2-1"></div>
  <div class="score-num" id="num-2-1">50</div>
  <div class="slider-wrap">
    <input type="range" min="0" max="100" step="1" value="50" id="sl-2-1" oninput="updateNum('2-1', this.value)">
    <div class="slider-labels"><span>0</span><span>100</span></div>
  </div>
  <button class="btn" id="btn-2-1" onclick="submit21()"></button>
</div>

<!-- ====== 2-2: Initial Good Feeling ====== -->
<div class="screen" id="s-2-2">
  <div class="title" id="t-2-2"></div>
  <div class="score-num" id="num-2-2">50</div>
  <div class="slider-wrap">
    <input type="range" min="0" max="100" step="1" value="50" id="sl-2-2" oninput="updateNum('2-2', this.value)">
    <div class="slider-labels"><span>0</span><span>100</span></div>
  </div>
  <button class="btn" id="btn-2-2" onclick="submit22()"></button>
</div>

<!-- ====== 3-1: Comfort why ====== -->
<div class="screen" id="s-3-1">
  <div class="title" id="t-3-1"></div>
  <input type="text" class="text-input" id="in-3-1" autocomplete="off" oninput="updateBtn('3-1')">
  <button class="btn" id="btn-3-1" onclick="submit31()" disabled></button>
  <button class="btn-ghost" id="btn-3-1-skip" onclick="skip31()"></button>
</div>

<!-- ====== 4-1: Comfort alternative state ====== -->
<div class="screen" id="s-4-1">
  <div class="title" id="t-4-1"></div>
  <input type="text" class="text-input" id="in-4-1" autocomplete="off" oninput="updateBtn('4-1')">
  <button class="btn" id="btn-4-1" onclick="submit41()" disabled></button>
</div>

<!-- ====== 5-1: Comfort breathing (4 steps, one screen with internal step state) ====== -->
<div class="screen" id="s-5-1">
  <div class="breath-dots" id="breath-1-dots"></div>
  <div class="breath-focus" id="t-5-1"></div>
  <div class="breath-circle pulse" id="circle-5-1"></div>
  <button class="btn" id="btn-5-1" onclick="startBreath1()"></button>
</div>

<!-- ====== 3-2: Good Feeling why ====== -->
<div class="screen" id="s-3-2">
  <div class="title" id="t-3-2"></div>
  <input type="text" class="text-input" id="in-3-2" autocomplete="off" oninput="updateBtn('3-2')">
  <button class="btn" id="btn-3-2" onclick="submit32()" disabled></button>
  <button class="btn-ghost" id="btn-3-2-skip" onclick="skip32()"></button>
</div>

<!-- ====== 4-2: Good Feeling alternative state ====== -->
<div class="screen" id="s-4-2">
  <div class="title" id="t-4-2"></div>
  <input type="text" class="text-input" id="in-4-2" autocomplete="off" oninput="updateBtn('4-2')">
  <button class="btn" id="btn-4-2" onclick="submit42()" disabled></button>
</div>

<!-- ====== 5-2: Good Feeling breathing (4 steps, parallel to 5-1) ====== -->
<div class="screen" id="s-5-2">
  <div class="breath-dots" id="breath-2-dots"></div>
  <div class="breath-focus" id="t-5-2"></div>
  <div class="breath-circle pulse" id="circle-5-2"></div>
  <button class="btn" id="btn-5-2" onclick="startBreath2()"></button>
</div>

<!-- ====== FINAL: Comfort ====== -->
<div class="screen" id="s-final-c">
  <div class="title" id="t-final-c"></div>
  <div class="score-num" id="num-final-c">50</div>
  <div class="slider-wrap">
    <input type="range" min="0" max="100" step="1" value="50" id="sl-final-c" oninput="updateNum('final-c', this.value)">
    <div class="slider-labels"><span>0</span><span>100</span></div>
  </div>
  <button class="btn" id="btn-final-c" onclick="submitFinalC()"></button>
</div>

<!-- ====== FINAL: Good Feeling ====== -->
<div class="screen" id="s-final-g">
  <div class="title" id="t-final-g"></div>
  <div class="score-num" id="num-final-g">50</div>
  <div class="slider-wrap">
    <input type="range" min="0" max="100" step="1" value="50" id="sl-final-g" oninput="updateNum('final-g', this.value)">
    <div class="slider-labels"><span>0</span><span>100</span></div>
  </div>
  <button class="btn" id="btn-final-g" onclick="submitFinalG()"></button>
</div>

<!-- ====== RESULT ====== -->
<div class="screen" id="s-result">
  <div class="result-section">
    <div class="result-core-label" id="t-result-core-label"></div>
    <div class="result-core-text" id="t-result-core"></div>
  </div>
  <div class="result-section">
    <div class="result-ba-header" id="t-result-ba-header"></div>
    <div class="result-row">
      <div class="result-row-label" id="t-result-comfort-label"></div>
      <div class="result-row-values">
        <span class="result-before" id="t-result-comfort-before">—</span>
        <span class="result-arrow">→</span>
        <span class="result-after" id="t-result-comfort-after">—</span>
      </div>
    </div>
    <div class="result-row">
      <div class="result-row-label" id="t-result-good-label"></div>
      <div class="result-row-values">
        <span class="result-before" id="t-result-good-before">—</span>
        <span class="result-arrow">→</span>
        <span class="result-after" id="t-result-good-after">—</span>
      </div>
    </div>
  </div>
  <div class="result-msg" id="t-result-msg"></div>
  <div class="result-saved" id="t-result-saved" style="visibility:hidden"></div>
  <button class="btn" id="btn-start-again" onclick="startAgain()"></button>
</div>

<script>
var STR = {
  ja: {

    s12: function(a){ return a + ' の何が問題？'; },
    s2c: function(cp){ return '（' + cp + '）という問題の「快」の度合いは？'; },
    s2g: function(cp){ return '（' + cp + '）という問題の「いい気分」の度合いは？'; },
    s31: function(cp){ return '（' + cp + '）の問題がある人にとって、それが「快」ではないのはなぜ？'; },
    s32: function(cp){ return '（' + cp + '）の問題がある人にとって、それが「いい気分」ではないのはなぜ？'; },
    s41: function(cw){ return cw + ' の代わりに、どんな状態が「快」？'; },

    breath2_1: function(ga){ return ga + ' に対する抵抗を感じる。'; },
    breath2_2: function(ga){ return 'その抵抗以外のすべてを感じる。'; },
    breath2_3: function(ga){ return '抵抗が存在しない状態を感じる。'; },
    breath2_4: function(ga){ return '「なぜ私は ' + ga + ' の状態？」を感じる。'; },
    next: '次へ',
    nothingComesUp: '出てこない',
    startBreathing: '呼吸を始める',
    resultMsg: '問題はまだあっても、内側の状態は変わりました。',
    coreProblemLabel: '中心の問題',
    comfortLabel: '快',

    s41: function(cw){ return 'Instead of ' + cw + ', what state would feel comfortable?'; },

    next: '下一步',
    nothingComesUp: '沒有浮現',
    startBreathing: '開始呼吸',
    resultMsg: '問題也許還在，但你內在的狀態已經改變了。',

    goodFeelingLabel: '好感覺',
    beforeAfterLabel: 'Before / After',
    startAgain: '再做一次',
    savedToHistory: '已儲存到紀錄。'
  }
};

var LANG = 'en';
var cur = 's-lang';
var D = {
  originalProblem: '',
  coreProblem: '',
  initialComfort: null,
  initialGoodFeeling: null,
  comfortWhy: '',
  comfortAlternative: '',
  goodFeelingWhy: '',
  goodFeelingAlternative: '',
  finalComfort: null,
  finalGoodFeeling: null,
  breathStep: 1,
  noAnswerStreak: 0,
  iterations: []
};
var breathingInProgress = false;

function fwd(id){
  var c = document.getElementById(cur);
  var n = document.getElementById(id);
  if (!c || !n || cur === id) return;
  c.classList.remove('active');
  c.classList.add('exit');
  setTimeout(function(){ c.classList.remove('exit'); }, 500);
  setTimeout(function(){ n.classList.add('active'); cur = id; }, 120);
}

function setText(id, t){ document.getElementById(id).textContent = t; }
function val(id){ return document.getElementById(id).value; }

function applyStaticLabels(){
  var s = STR[LANG];
  setText('t-1-1', s.s11);
  setText('btn-1-1', s.next);
  setText('btn-1-2', s.next);
  setText('btn-1-2-skip', s.nothingComesUp);
  setText('btn-2-1', s.next);
  setText('btn-2-2', s.next);
  setText('btn-3-1', s.next);
  setText('btn-3-1-skip', s.nothingComesUp);
  setText('btn-4-1', s.next);
  setText('btn-5-1', s.startBreathing);
  setText('btn-3-2', s.next);
  setText('btn-3-2-skip', s.nothingComesUp);
  setText('btn-4-2', s.next);
  setText('btn-5-2', s.startBreathing);
  setText('btn-final-c', s.next);
  setText('btn-final-g', s.next);
  setText('t-result-core-label', s.coreProblemLabel);
  setText('t-result-ba-header', s.beforeAfterLabel);
  setText('t-result-comfort-label', s.comfortLabel);
  setText('t-result-good-label', s.goodFeelingLabel);
  setText('t-result-msg', s.resultMsg);
  setText('t-result-saved', s.savedToHistory);
  setText('btn-start-again', s.startAgain);
}

function selectLang(lang){
  LANG = lang;
  document.documentElement.lang = (lang === 'zh' ? 'zh-Hant' : lang);
  document.body.className = 'lang-' + lang;
  applyStaticLabels();
  fwd('s-1-1');
}

function updateBtn(key){
  var v = val('in-' + key).trim();
  document.getElementById('btn-' + key).disabled = (v.length === 0);
}

function submit11(){
  var v = val('in-1-1').trim();
  if (!v) return;
  D.originalProblem = v;
  setText('t-1-2', STR[LANG].s12(D.originalProblem));
  document.getElementById('in-1-2').value = '';
  document.getElementById('btn-1-2').disabled = true;
  fwd('s-1-2');
}

function submit12(){
  var v = val('in-1-2').trim();
  if (!v) return;
  D.coreProblem = v;
  goInitial();
}

function submit12skip(){
  D.coreProblem = D.originalProblem;
  goInitial();
}

function goInitial(){
  setText('t-2-1', STR[LANG].s2c(D.coreProblem));
  resetSlider('2-1');
  fwd('s-2-1');
}

function resetSlider(key){
  var sl = document.getElementById('sl-' + key);
  if (sl) sl.value = 50;
  setText('num-' + key, '50');
}

function updateNum(key, v){
  setText('num-' + key, v);
}

function submit21(){
  D.initialComfort = parseInt(val('sl-2-1'), 10);
  setText('t-2-2', STR[LANG].s2g(D.coreProblem));
  resetSlider('2-2');
  fwd('s-2-2');
}

function submit22(){
  D.initialGoodFeeling = parseInt(val('sl-2-2'), 10);
  enterComfortBlock();
}

function enterComfortBlock(){
  setText('t-3-1', STR[LANG].s31(D.coreProblem));
  document.getElementById('in-3-1').value = '';
  document.getElementById('btn-3-1').disabled = true;
  fwd('s-3-1');
}

function submit31(){
  var v = val('in-3-1').trim();
  if (!v) return;
  D.comfortWhy = v;
  D.noAnswerStreak = 0;
  setText('t-4-1', STR[LANG].s41(v));
  document.getElementById('in-4-1').value = '';
  document.getElementById('btn-4-1').disabled = true;
  fwd('s-4-1');
}

function skip31(){
  D.noAnswerStreak++;
  if (D.noAnswerStreak >= 3){
    enterFinalMeasurement();
  } else {
    enterGoodBlock();
  }
}

function submit41(){
  var v = val('in-4-1').trim();
  if (!v) return;
  D.comfortAlternative = v;
  D.breathStep = 1;
  applyBreath1Step();
  fwd('s-5-1');
}

function applyBreath1Step(){
  var s = STR[LANG];
  var lines = [s.breath1_1, s.breath1_2, s.breath1_3, s.breath1_4];
  setText('t-5-1', lines[D.breathStep - 1](D.comfortAlternative));
  var dots = document.getElementById('breath-1-dots');
  dots.innerHTML = '';
  for (var i = 1; i <= 4; i++){
    var d = document.createElement('div');
    d.className = 'breath-dot' + (i < D.breathStep ? ' done' : (i === D.breathStep ? ' active' : ''));
    dots.appendChild(d);
  }
  var c = document.getElementById('circle-5-1');
  c.className = 'breath-circle pulse';
  c.textContent = '';
  var btn = document.getElementById('btn-5-1');
  btn.style.visibility = 'visible';
  btn.disabled = false;
}

function startBreath1(){
  if (breathingInProgress) return;
  breathingInProgress = true;
  var c = document.getElementById('circle-5-1');
  var btn = document.getElementById('btn-5-1');
  btn.style.visibility = 'hidden';
  c.classList.remove('pulse');
  c.classList.add('inhale');
  setTimeout(function(){
    c.classList.remove('inhale');
    c.classList.add('exhale');
    setTimeout(function(){
      c.classList.remove('exhale');
      c.textContent = '✓';
      setTimeout(function(){
        breathingInProgress = false;
        if (D.breathStep < 4){
          D.breathStep++;
          applyBreath1Step();
        } else {
          D.iterations.push({ block: 'comfort', why: D.comfortWhy, alternative: D.comfortAlternative });
          enterGoodBlock();
        }
      }, 700);
    }, 1500);
  }, 1500);
}

function enterGoodBlock(){
  setText('t-3-2', STR[LANG].s32(D.coreProblem));
  document.getElementById('in-3-2').value = '';

function startBreath2(){
  if (breathingInProgress) return;
  breathingInProgress = true;
  var c = document.getElementById('circle-5-2');
  var btn = document.getElementById('btn-5-2');
  btn.style.visibility = 'hidden';
  c.classList.remove('pulse');
  c.classList.add('inhale');
  setTimeout(function(){
    c.classList.remove('inhale');
    c.classList.add('exhale');

      c.classList.remove('exhale');
      c.textContent = '✓';
      setTimeout(function(){
        breathingInProgress = false;
        if (D.breathStep < 4){
          D.breathStep++;
          applyBreath2Step();
        } else {
          D.iterations.push({ block: 'goodFeeling', why: D.goodFeelingWhy, alternative: D.goodFeelingAlternative });
          enterComfortBlock();
        }
      }, 700);
    }, 1500);
  }, 1500);
}

function enterFinalMeasurement(){
  setText('t-final-c', STR[LANG].s2c(D.coreProblem));
  resetSlider('final-c');
  fwd('s-final-c');
}

function submitFinalC(){
  D.finalComfort = parseInt(val('sl-final-c'), 10);
  setText('t-final-g', STR[LANG].s2g(D.coreProblem));
  resetSlider('final-g');
  fwd('s-final-g');
}

function submitFinalG(){
  D.finalGoodFeeling = parseInt(val('sl-final-g'), 10);
  populateResult();
  var saved = saveHistoryEntry();
  var note = document.getElementById('t-result-saved');
  if (note) note.style.visibility = saved ? 'visible' : 'hidden';
  fwd('s-result');
}

function populateResult(){
  setText('t-result-core', D.coreProblem);
  setText('t-result-comfort-before', D.initialComfort != null ? String(D.initialComfort) : '—');
  setText('t-result-comfort-after',  D.finalComfort   != null ? String(D.finalComfort)   : '—');
  setText('t-result-good-before',    D.initialGoodFeeling != null ? String(D.initialGoodFeeling) : '—');
  setText('t-result-good-after',     D.finalGoodFeeling   != null ? String(D.finalGoodFeeling)   : '—');
}

function loadHistory(){
  try {
    var raw = localStorage.getItem('noetune_app_history');
    if (!raw) return [];
    var parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed;
  } catch(e) {
    return [];
  }
}

function saveHistoryEntry(){
  if (!D.iterations) D.iterations = [];
  var entry = {
    date: new Date().toISOString(),
    language: LANG,
    originalProblem: D.originalProblem,
    coreProblem: D.coreProblem,
    initialComfort: D.initialComfort,
    finalComfort: D.finalComfort,
    initialGoodFeeling: D.initialGoodFeeling,
    finalGoodFeeling: D.finalGoodFeeling,
    iterations: D.iterations
  };
  try {
    var hist = loadHistory();
    hist.push(entry);
    if (hist.length > 30) hist = hist.slice(hist.length - 30);
    localStorage.setItem('noetune_app_history', JSON.stringify(hist));
    return true;
  } catch(e) {
    return false;
  }
}

function resetSession(){
  D.originalProblem = '';
  D.coreProblem = '';
  D.initialComfort = null;
  D.initialGoodFeeling = null;
  D.comfortWhy = '';
  D.comfortAlternative = '';
  D.goodFeelingWhy = '';
  D.goodFeelingAlternative = '';
  D.finalComfort = null;
  D.finalGoodFeeling = null;
  D.breathStep = 1;
  D.noAnswerStreak = 0;
  D.iterations = [];
  ['1-1','1-2','3-1','3-2','4-1','4-2'].forEach(function(k){
    var inp = document.getElementById('in-' + k);
    if (inp) inp.value = '';
    var btn = document.getElementById('btn-' + k);
    if (btn) btn.disabled = true;
  });
  ['2-1','2-2','final-c','final-g'].forEach(function(k){
    resetSlider(k);
  });
}

function startAgain(){
  resetSession();
  document.documentElement.lang = 'en';
  document.body.className = '';
  fwd('s-lang');
}
</script>
