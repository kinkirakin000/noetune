<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noetune</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #FAFAF7;
  --text: #1A1A1A;
  --muted: #A8A8A2;
  --soft: #77736E;
  --primary: #6B9080;
  --item-border: #E8E8E2;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151412;
    --text: #F5EFE6;
    --muted: #8E8981;
    --soft: #6A6560;
    --primary: #8FB8A4;
    --item-border: rgba(245,239,230,.1);
  }
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Serif JP', serif;
  font-weight: 300;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
  padding: 0 2rem;
}

/* ── Header ── */
.header {
  padding: 2.8rem 0 0;
  text-align: center;
}

.logo {
  font-size: .75rem;
  font-weight: 400;
  letter-spacing: .2em;
  color: var(--muted);
}

/* ── Hero ── */
.hero {
  padding: 4rem 0 3rem;
  text-align: center;
}

.hero-title {
  font-size: 1.35rem;
  font-weight: 400;
  line-height: 2;
  letter-spacing: .06em;
  color: var(--text);
  white-space: pre-line;
  margin-bottom: 2rem;
}

.hero-sub {
  font-size: .82rem;
  font-weight: 300;
  line-height: 2.1;
  letter-spacing: .04em;
  color: var(--soft);
  white-space: pre-line;
  margin-bottom: 2.6rem;
}

.btn-start {
  display: inline-block;
  background: var(--primary);
  color: #fff;
  font-family: 'Noto Serif JP', serif;
  font-size: .9rem;
  font-weight: 400;
  letter-spacing: .12em;
  text-decoration: none;
  padding: 14px 52px;
  border-radius: 40px;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .2s;
}

.btn-start:active {
  opacity: .8;
}

/* ── Use cases ── */
.section {
  padding: 3.5rem 0;
  border-top: 1px solid var(--item-border);
}

.section-title {
  font-size: .78rem;
  font-weight: 400;
  letter-spacing: .12em;
  color: var(--muted);
  margin-bottom: 1.8rem;
  text-align: center;
}

.item-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.item-list li {
  font-size: .84rem;
  font-weight: 300;
  line-height: 1.85;
  letter-spacing: .03em;
  color: var(--text);
  padding-left: 1em;
  text-indent: -1em;
}

/* ── Footer copy ── */
.footer-copy {
  padding: 3rem 0 4.5rem;
  border-top: 1px solid var(--item-border);
  text-align: center;
}

.footer-copy p {
  font-size: .78rem;
  font-weight: 300;
  line-height: 2.1;
  letter-spacing: .04em;
  color: var(--muted);
  white-space: pre-line;
}

.footer-copy p + p {
  margin-top: 1.4rem;
}
</style>
</head>
<body>

<div class="wrap">

  <header class="header">
    <div class="logo">NOETUNE</div>
  </header>

  <section class="hero">
    <div class="hero-title">考えすぎた神経系を、
数分で静かに戻す。</div>
    <div class="hero-sub">Noetuneは、
情報や決断のノイズから、
静かに自分へ戻るためのツールです。</div>
    <a class="btn-start" href="app-v10.html">始める</a>
  </section>

  <section class="section">
    <div class="section-title">こんな状態のときに</div>
    <ul class="item-list">
      <li>・ChatGPTで整理しても、頭が止まらない</li>
      <li>・Notionは整っているのに、自分は整わない</li>
      <li>・休んでも、神経のスイッチが閉じない</li>
      <li>・仕事の後も、切り替わらない</li>
    </ul>
  </section>

  <footer class="footer-copy">
    <p>Noetuneは、
問題を分析するアプリではありません。</p>
    <p>短い問いと呼吸だけで、
静かに自分へ戻ります。</p>
  </footer>

</div>

</body>
</html>
