function selectTheme(key, label) {
  if (v17QuestionIndex[key]) {
    selectHCQQuestion(v17QuestionIndex[key]);
    return;
  }
  D.themeKey = key; D.theme = label;
  D.themePositive = getThemeLabel(key);
  D.themeNegative = getThemeNegative(key);
  clearV17QuestionState();
  themeChosen = true;
  trackEvent('theme_selected', { themeKey: key, lang: lang });
  try { localStorage.setItem('ntn_last_theme_key', key); } catch(e) {}
  document.querySelectorAll('.theme-btn').forEach(function(b){
    b.classList.toggle('selected', b.dataset.themeKey === key);
  });
  var inp = document.getElementById('in-custom-theme'); if (inp) inp.value = '';
  updateThemeCTA();
}

function onCustomTheme(val) {
  var trimmed = val.trim();
  document.querySelectorAll('.theme-btn').forEach(function(b){ b.classList.remove('selected'); });
  if (trimmed) {
    D.themeKey = null; D.theme = trimmed;
    if (lang === 'ja') {
      D.themePositive = trimmed + 'がある'; D.themeNegative = trimmed + 'がない';
    } else {
      D.themePositive = trimmed; D.themeNegative = getAutoNegative(trimmed);
    }
    clearV17QuestionState();
    themeChosen = true;
    try { localStorage.removeItem('ntn_last_theme_key'); } catch(e) {}
  } else {
    clearV17QuestionState();
    themeChosen = false;
  }
  updateThemeCTA();
}

function updateThemeCTA() {
  var wrap = document.getElementById('theme-cta-wrap');
  if (!wrap) return;
  if (themeChosen && cur === 's-theme') { wrap.style.opacity = '1'; wrap.style.pointerEvents = 'auto'; }
  else                                  { wrap.style.opacity = '0'; wrap.style.pointerEvents = 'none'; }
}

function ensureCurrentTheme() {
  ensureV17QuestionState();
  if (D.questionId && D.questionTextAtTime) {
    D.themeKey = D.questionId;
    D.theme = D.questionTextAtTime;
    D.themePositive = D.questionTextAtTime;
    D.themeNegative = D.questionTextAtTime;
    themeChosen = true;
    return true;
  }
  if (D.theme && D.theme.trim()) {
    if (!D.themePositive) D.themePositive = D.theme;
    if (!D.themeNegative) {
      D.themeNegative = D.themeKey ? getThemeNegative(D.themeKey) : getAutoNegative(D.themePositive);
    }
    return true;
  }
  if (D.themeKey) {
    var label = getThemeLabel(D.themeKey);
    if (label && label !== D.themeKey) {
      D.theme = label; D.themePositive = label; D.themeNegative = getThemeNegative(D.themeKey);
      themeChosen = true; return true;
    }
  }
  var selected = document.querySelector('.theme-btn.selected');
  if (selected && (selected.dataset.themeLabel || selected.textContent.trim())) {
    D.theme = selected.dataset.themeLabel || selected.textContent.trim();
    D.themeKey = selected.dataset.themeKey || D.themeKey || null;
    D.themePositive = D.themeKey ? getThemeLabel(D.themeKey) : D.theme;
    D.themeNegative = D.themeKey ? getThemeNegative(D.themeKey) : getAutoNegative(D.themePositive);
    themeChosen = true; return true;
  }
  var inp = document.getElementById('in-custom-theme');
  if (inp && inp.value.trim()) {
    D.theme = inp.value.trim(); D.themeKey = null;
    if (lang === 'ja') {
      D.themePositive = D.theme + 'がある'; D.themeNegative = D.theme + 'がない';
    } else {
      D.themePositive = D.theme; D.themeNegative = getAutoNegative(D.theme);
    }
    themeChosen = true; return true;
  }
  return false;
}

function showDoorScreen() {
  var pos = D.themePositive || D.theme;
  var neg = D.themeNegative;
  // qPos: raw theme name without the がある/がない suffix, used only for the
  // question display text. D.theme holds the user's input or the keyed theme's
  // short label before any suffix was appended. The _doorSentences templates
  // continue to use pos (D.themePositive) for grammatically correct sentences.
  var qPos = D.theme || D.themePositive;
  var isJa = lang === 'ja';
  setEl('t-door-title', T('door_title'));
  _doorSentences.A = T('door_a_template', {pos: pos, neg: neg});
  _doorSentences.B = T('door_b_template', {pos: pos, neg: neg});
  _doorSentences.C = T('door_c_template', {pos: pos, neg: neg});
  setEl('door-q-a', T('door_a_question_template', {pos: qPos, neg: neg}));
  setEl('door-q-b', T('door_b_question_template', {pos: qPos, neg: neg}));
  setEl('door-q-c', T('door_c_question_template', {pos: qPos, neg: neg}));
  setEl('door-rq-b', T('door_b_question_template', {pos: qPos, neg: neg}));
  setEl('door-rq-c', T('door_c_question_template', {pos: qPos, neg: neg}));
  resetDoorAnswerInputPosition();
  var sharedInp = document.getElementById('door-answer-input');
  if (sharedInp) {
    sharedInp.value = '';
    sharedInp.placeholder = T('door_answer_placeholder');
    sharedInp.disabled = true;
    sharedInp.style.display = isJa ? 'none' : '';
  }
  ['a','b','c'].forEach(function(d) {
    var card = document.getElementById('door-card-' + d);
    if (card) card.classList.remove('selected');
  });
  ['b','c'].forEach(function(d) {
    var opt = document.getElementById('door-radio-' + d);
    if (opt) opt.classList.remove('selected');
  });
  _selectedDoorCard = null;
  var cardsWrap = document.getElementById('door-cards-wrap');
  if (cardsWrap) cardsWrap.style.display = isJa ? 'none' : 'flex';
  var radioWrap = document.getElementById('door-radio-wrap');
  if (radioWrap) radioWrap.style.display = isJa ? 'flex' : 'none';
  var cardA = document.getElementById('door-card-a');
  if (cardA) cardA.style.display = isJa ? 'none' : '';
  var btn = document.getElementById('btn-door-next');
  if (btn) { btn.disabled = true; btn.textContent = T('door_next_button'); }
  fwd('s-door');
}

function resetDoorAnswerInputPosition() {
  var inp = document.getElementById('door-answer-input');
  var wrap = document.getElementById('door-cta-wrap');
  var btn = document.getElementById('btn-no-answer');
  if (inp && btn && btn.parentNode) btn.parentNode.insertBefore(inp, btn);
  if (wrap && btn && btn.parentNode) btn.parentNode.insertBefore(wrap, btn);
}

function moveDoorAnswerInputUnder(target) {
  var inp = document.getElementById('door-answer-input');
  var wrap = document.getElementById('door-cta-wrap');
  if (inp && target && target.parentNode) {
    target.insertAdjacentElement('afterend', inp);
    if (wrap) inp.insertAdjacentElement('afterend', wrap);
  }
  return inp;
}

function selectDoorCard(door) {
  _selectedDoorCard = door;
  trackEvent('door_selected', { door: door, lang: lang });
  var selectedCard = null;
  ['A','B','C'].forEach(function(d) {
    var card = document.getElementById('door-card-' + d.toLowerCase());
    if (card) {
      if (d === door) {
        card.classList.add('selected');
        selectedCard = card;
      }
      else card.classList.remove('selected');
    }
  });
  var inp = moveDoorAnswerInputUnder(selectedCard);
  if (inp) { inp.disabled = false; inp.focus(); }
  var btn = document.getElementById('btn-door-next');
  if (btn) btn.disabled = !inp || !inp.value.trim();
}

function selectDoorRadio(door) {
  _selectedDoorCard = door;
  trackEvent('door_selected', { door: door, lang: lang });
  var selectedOption = null;
  ['B','C'].forEach(function(d) {
    var opt = document.getElementById('door-radio-' + d.toLowerCase());
    if (opt) {
      if (d === door) {
        opt.classList.add('selected');
        selectedOption = opt;
      }
      else opt.classList.remove('selected');
    }
  });
  var inp = moveDoorAnswerInputUnder(selectedOption);
  if (inp) {
    inp.style.display = '';
    inp.disabled = false;
    try { inp.focus(); } catch(e) {}
  }
  var btn = document.getElementById('btn-door-next');
  if (btn) btn.disabled = !inp || !inp.value.trim();
}

];

function cloneV17NavigationSnapshotValue(value) {
  return value && typeof value === 'object' ? cloneV17State(value) : value;
}

function captureV17NavigationSnapshot(screenId) {
  var snapshot = { screenId: screenId || cur };
  V17_NAV_SNAPSHOT_KEYS.forEach(function(key) {
    snapshot[key] = cloneV17NavigationSnapshotValue(window[key]);
  });
  return snapshot;
}

function restoreV17NavigationSnapshot(snapshot) {
  if (!snapshot) return;
  V17_NAV_SNAPSHOT_KEYS.forEach(function(key) {
    if (!Object.prototype.hasOwnProperty.call(snapshot, key)) return;
    var value = snapshot[key];
    window[key] = value && typeof value === 'object' ? cloneV17State(value) : value;
  });
}

function resumeV17RepeatCycle() {

  var repeatCycleCount = typeof v17RepeatCycleCount === 'number'
    ? v17RepeatCycleCount
    : (D.v17Flow && typeof D.v17Flow.cycleCount === 'number'
      ? D.v17Flow.cycleCount + 1
      : 2);
  v17RepeatModeSelectionPending = false;
  v17RepeatBeforeScore = null;
  v17RepeatCycleCount = null;
  resetV17SessionState(true);
  _savedProgressResumeActive = false;
  D.entryMode = 'v17';
  D.v17SessionMode = mode === 'deep' ? 'deep' : 'regular';
  D.themeKey = D.themeId || D.questionId || null;
  D.theme = D.questionTextAtTime;
  D.themePositive = D.questionTextAtTime;

  D.ideal = '';
  D.shiftNote = '';
  D.reactionAnswer = '';
  D.idealAnswer = '';
  D.breathEaseBefore = previousAfter;
  D.breathEaseAfter = null;
  D.v13OriginalTheme = '';
  D.v13History = [];
  D.firstThemeScore = previousAfter;
  D.initialThemeScore = previousAfter;
  D.beforeEmotionPositive = previousAfter;
  D.afterEmotionPositive = null;
  D.v17Flow = createV17FlowState();
  D.v17Flow.cycleCount = repeatCycleCount;
  D.v17Flow.isBeforeMeasured = true;

  D.v17Flow.beforeEmotionPositive = previousAfter;

function getV17DeepDiveResultEntries() {
  var flow = D.v17Flow || {};
  var deep = flow.deepDive;
  if (!deep) return [];
  var rounds = Array.isArray(deep.rounds) ? deep.rounds.slice() : [];
  var pending = deep.pendingRound;
  if (pending) {
    var pendingIdeal = String(pending.idealState || '').trim();
    if (pendingIdeal) {
      var alreadyIncluded = rounds.some(function(round) {
        return round && round.round === pending.round;
      });
      if (!alreadyIncluded) rounds.push(pending);
    }
  }
  return rounds.sort(function(a, b) {
    return (Number(a && a.round) || 0) - (Number(b && b.round) || 0);
  }).map(function(round) {
    var ideal = String(round && round.idealState || '').trim();
    if (!ideal) return null;
    return {
      round: round.round,
      kind: 'idealState',
      text: ideal
    };
  }).filter(Boolean);
}

function restoreV17Slider(key, value) {
  var notAProblem = document.getElementById('nm-' + key);
  var number = document.getElementById('num-' + key);
  var button = document.getElementById('next-' + key);
  if (value === V17_SCORE_NOT_A_PROBLEM) {
    if (notAProblem) {
      notAProblem.classList.add('selected');
      notAProblem.setAttribute('aria-pressed', 'true');
    }
    if (number) {
      number.textContent = v17Copy('flow.measurement.cannotQuantify');
      number.className = 'score-num nm';
    }
    if (button) button.disabled = false;
    return;
  }
  if (typeof value !== 'number') {
    resetSlider(key);
    return;
  }
  var slider = document.getElementById('sl-' + key);
  if (slider) slider.value = value;
  if (notAProblem) {
    notAProblem.classList.remove('selected');
    notAProblem.setAttribute('aria-pressed', 'false');
  }
  if (number) {
    number.textContent = String(value);
    number.className = 'score-num shown';
  }
  if (button) button.disabled = false;
}

function getV17DeepDiveRouteType() {
  if (D && D.themeSource === 'spiritual-wisdom') return 'spiritual';
  return getV17ThemeRoute() === 'ideals' ? 'ideal' : 'problem';
}

function getV17DeepDivePhaseOrder(routeType) {
  return routeType === 'problem'
    ? ['ideal', 'current', 'feel100']
    : ['current', 'feel100', 'ideal'];
}

function getV17DeepDiveStartPhase(routeType) {
  return getV17DeepDivePhaseOrder(routeType)[0];
}

function getV17DeepDiveNextPhase(routeType, phase) {
  var order = getV17DeepDivePhaseOrder(routeType);
  var index = order.indexOf(phase);
  return index >= 0 && index < order.length - 1 ? order[index + 1] : null;
}

function getV17DeepDiveFieldForPhase(routeType, phase) {
  if (phase === 'feel100') return 'feltHappiness100';
  if (routeType === 'problem') return phase === 'ideal' ? 'idealState' : 'currentState';
  return phase === 'current' ? 'currentState' : 'idealState';
}

function getV17DeepDivePromptPath(routeType, phase) {
  if (routeType === 'problem') return phase === 'ideal' ? 'flow.step2.problems' : 'flow.step3.problems';
  return phase === 'current' ? 'flow.step2.ideals' : 'flow.step3.ideals';
}

function getV17DeepDiveNextSourceQuote(routeType, round) {
  if (!round) return D.questionTextAtTime || '';
  var source = routeType === 'problem' ? round.currentState : round.idealState;
  return String(source || '').trim();
}

function getV17DeepDiveRoundQuote(routeType, round, pendingRound) {
  if (pendingRound && typeof pendingRound === 'object') {
    var inlineQuote = routeType === 'problem' ? pendingRound.currentState : pendingRound.idealState;
    inlineQuote = String(inlineQuote || '').trim();
    if (inlineQuote) return inlineQuote;
  }
  if (round > 1 && D.v17Flow && D.v17Flow.deepDive && Array.isArray(D.v17Flow.deepDive.rounds)) {
    var rounds = D.v17Flow.deepDive.rounds;
    var last = rounds.length ? rounds[rounds.length - 1] : null;
    if (last) {
      if (routeType === 'problem') return last.currentState || last.idealState || D.questionTextAtTime || '';
      return last.idealState || last.currentState || D.questionTextAtTime || '';
    }
  }
  return D.questionTextAtTime || '';
}

function getV17DeepDiveDisplayQuote(deep) {
  deep = deep || ensureV17DeepDiveState();
  var pending = deep.pendingRound || {};
  var phase = deep.phase || getV17DeepDiveStartPhase(deep.routeType);
  if (deep.routeType === 'problem') {
    if (phase === 'ideal') {
      return String(pending.sourceQuote || D.questionTextAtTime || '').trim();
    }
    if (phase === 'current') {
      return String(pending.idealState || pending.idealStateDraft || '').trim();
    }
    if (phase === 'feel100') {
      return String(pending.currentState || pending.currentStateDraft || '').trim();
    }
  } else {
    if (phase === 'current') {
      return String(pending.sourceQuote || D.questionTextAtTime || '').trim();
    }
    if (phase === 'feel100' || phase === 'ideal') {
      return String(pending.currentState || pending.currentStateDraft || '').trim();
    }
  }
  return String(pending.sourceQuote || D.questionTextAtTime || '').trim();
}

function getV17DeepDiveDraftValue(round, field) {
  if (!round) return '';
  if (field === 'idealState') {
    return typeof round.idealStateDraft === 'string'
      ? round.idealStateDraft
      : String(round.idealState || '');
  }
  return typeof round.currentStateDraft === 'string'
    ? round.currentStateDraft
    : String(round.currentState || '');
}

function getV17DeepDivePreviousPhase(routeType, phase) {
  var order = getV17DeepDivePhaseOrder(routeType);
  var index = order.indexOf(phase);
  return index > 0 ? order[index - 1] : null;
}

    round: round,
    currentState: '',

    sourceQuote: sourceQuote || '',
    currentStateDraft: '',
    idealStateDraft: '',
    routeType: routeType

}

function ensureV17DeepDiveState() {
  ensureV17SessionState();
  if (!D.v17Flow) D.v17Flow = createV17FlowState();
  var deep = D.v17Flow.deepDive;
  if (!deep || typeof deep !== 'object') {
    deep = initV17DeepDiveState();
  }
  return deep;
}

function initV17DeepDiveState() {
  ensureV17SessionState();
  var routeType = getV17DeepDiveRouteType();
  var deep = {
    routeType: routeType,
    round: 1,
    phase: getV17DeepDiveStartPhase(routeType),
    rounds: [],
    pendingRound: null,
    sourceQuote: '',
    finished: false
  };
  D.v17Flow.deepDive = deep;
  return deep;
}

function syncV17DeepDiveDrafts() {
  ensureV17SessionState();
  var flow = D.v17Flow;
  var deep = flow && flow.deepDive;
  var round = deep && deep.pendingRound ? deep.pendingRound : null;
  if (!flow || !deep || !round) return;
  var committedCurrent = typeof round.currentState === 'string'
    ? round.currentState : String(round.currentState || '');
  var committedIdeal = typeof round.idealState === 'string'
    ? round.idealState : String(round.idealState || '');
  if (deep.routeType === 'problem') {
    D.idealStateDraft = getV17DeepDiveDraftValue(round, 'idealState');
    D.currentStateDraft = getV17DeepDiveDraftValue(round, 'currentState');
  } else {
    D.currentStateDraft = getV17DeepDiveDraftValue(round, 'currentState');
    D.idealStateDraft = getV17DeepDiveDraftValue(round, 'idealState');
  }
  flow.currentStateDraft = D.currentStateDraft;
  flow.idealStateDraft = D.idealStateDraft;
  D.currentState = committedCurrent;
  D.currentStateText = committedCurrent;
  flow.currentState = committedCurrent;
  flow.currentStateText = committedCurrent;
  D.idealState = committedIdeal;
  D.idealStateText = committedIdeal;
  flow.idealState = committedIdeal;
  flow.idealStateText = committedIdeal;
  if (deep.routeType === 'problem') {
    flow.step2Text = committedIdeal;
    flow.step3Text = committedCurrent;
  } else {
    flow.step2Text = committedCurrent;
    flow.step3Text = committedIdeal;
  }
}

function startV17DeepDive() {
  ensureV17SessionState();
  var deep = D.v17Flow && D.v17Flow.deepDive && !D.v17Flow.deepDive.finished
    ? D.v17Flow.deepDive : null;
  if (!deep) deep = initV17DeepDiveState();
  else {
    deep.routeType = deep.routeType || getV17DeepDiveRouteType();
    deep.phase = deep.phase || getV17DeepDiveStartPhase(deep.routeType);
    deep.round = deep.round || 1;
    if (!Array.isArray(deep.rounds)) deep.rounds = [];
  }
  if (!deep.pendingRound) {
    var startQuote = getV17DeepDiveRoundQuote(deep.routeType, deep.round, null);
    deep.pendingRound = createV17DeepDiveRound(deep.routeType, deep.round, startQuote);
    deep.sourceQuote = startQuote;
  }
  syncV17DeepDiveDrafts();
  openV17DeepDiveScreen();
}

function commitV17DeepDiveCurrentInput(allowEmpty) {
  var deep = ensureV17DeepDiveState();
  var input = document.getElementById('in-v17-deep-response');
  var value = input ? String(input.value || '').trim() : '';
  var phase = deep.phase || getV17DeepDiveStartPhase(deep.routeType);
  var field = getV17DeepDiveFieldForPhase(deep.routeType, phase);
  if (!value && !allowEmpty && field !== 'feltHappiness100') return '';
  if (!deep.pendingRound) {
    var source = getV17DeepDiveRoundQuote(deep.routeType, deep.round, null);
    deep.pendingRound = createV17DeepDiveRound(deep.routeType, deep.round, source);
    deep.sourceQuote = source;
  }
  var round = deep.pendingRound;
  if (field === 'idealState') {
    round.idealStateDraft = value;
    D.idealStateDraft = value;
    if (D.v17Flow) D.v17Flow.idealStateDraft = value;
    if (value || allowEmpty) {
      round.idealState = value;
      D.idealState = value;
      D.idealStateText = value;
      if (D.v17Flow) {
        D.v17Flow.idealState = value;
        D.v17Flow.idealStateText = value;
      }
    }
  } else if (field === 'currentState') {
    round.currentStateDraft = value;
    D.currentStateDraft = value;
    if (D.v17Flow) D.v17Flow.currentStateDraft = value;
    if (value || allowEmpty) {
      round.currentState = value;
      D.currentState = value;
      D.currentStateText = value;
      if (D.v17Flow) {
        D.v17Flow.currentState = value;
        D.v17Flow.currentStateText = value;
      }
    }
  }
  syncV17DeepDiveDrafts();
  return value;
}

function submitV17DeepDiveResponse(allowEmpty) {
  var deep = ensureV17DeepDiveState();
  var value = commitV17DeepDiveCurrentInput(!!allowEmpty);
  if (!value && !allowEmpty) return;
  var nextPhase = getV17DeepDiveNextPhase(deep.routeType, deep.phase);
  if (nextPhase === null) {
    completeV17DeepDiveRound();
    return;
  }
  deep.phase = nextPhase;
  deep.sourceQuote = value || (deep.pendingRound && deep.pendingRound.sourceQuote) || deep.sourceQuote || '';
  if (deep.pendingRound) deep.pendingRound.sourceQuote = deep.sourceQuote;
  openV17DeepDiveScreen();
}

function submitV17DeepDiveFeel100() {
  var deep = ensureV17DeepDiveState();
  if (!deep.pendingRound) {
    var source = getV17DeepDiveRoundQuote(deep.routeType, deep.round, null);
    deep.pendingRound = createV17DeepDiveRound(deep.routeType, deep.round, source);
    deep.sourceQuote = source;
  }
  deep.pendingRound.feltHappiness100 = true;
  var nextPhase = getV17DeepDiveNextPhase(deep.routeType, deep.phase);
  if (nextPhase === null) {
    completeV17DeepDiveRound();
    return;
  }
  deep.phase = nextPhase;
  deep.sourceQuote = deep.pendingRound.currentState || deep.pendingRound.idealState || deep.sourceQuote || '';
  deep.pendingRound.sourceQuote = deep.sourceQuote;
  openV17DeepDiveScreen();
}

function completeV17DeepDiveRound() {
  var deep = ensureV17DeepDiveState();
  var round = deep.pendingRound;
  if (!round) {
    finishV17DeepDive();
    return;
  }
  var hasContent = String(round.currentState || '').trim() || String(round.idealState || '').trim();
  if (hasContent) {
    deep.rounds.push(cloneV17State(round));
  }
  var nextSourceQuote = getV17DeepDiveNextSourceQuote(deep.routeType, round) || D.questionTextAtTime || '';
  deep.round += 1;
  deep.phase = getV17DeepDiveStartPhase(deep.routeType);
  deep.pendingRound = createV17DeepDiveRound(
    deep.routeType,
    deep.round,
    nextSourceQuote
  );
  deep.sourceQuote = nextSourceQuote;
  deep.finished = false;
  syncV17DeepDiveDrafts();
  openV17DeepDiveScreen();
}

function handleV17DeepDiveBack() {
  var flow = D && D.v17Flow;
  var deep = flow && flow.deepDive;
  if (!deep) return false;
  if (cur !== 's-v17-deep-response' && cur !== 's-v17-deep-feel-100') return false;
  ensureV17SessionState();

  var routeType = deep.routeType || getV17DeepDiveRouteType();
  var startPhase = getV17DeepDiveStartPhase(routeType);
  var phase = deep.phase || startPhase;
  var isResponseScreen = cur === 's-v17-deep-response';

  if (isResponseScreen) {
    commitV17DeepDiveCurrentInput(true);
    if (deep.round > 1 && phase === startPhase) {
      var previousRound = Array.isArray(deep.rounds) && deep.rounds.length ? deep.rounds.pop() : null;
      if (!previousRound) return false;
      deep.pendingRound = cloneV17State(previousRound);
      deep.round = previousRound.round || Math.max(1, deep.round - 1);
      deep.phase = getV17DeepDivePhaseOrder(routeType).slice(-1)[0];
      deep.sourceQuote = deep.pendingRound.sourceQuote || D.questionTextAtTime || '';
      deep.finished = false;
      syncV17DeepDiveDrafts();
      setV17ScreenDirectWithoutHistoryReset(
        deep.phase === 'feel100' ? 's-v17-deep-feel-100' : 's-v17-deep-response'
      );
      renderV17Screen(cur);
      return true;
    }
    var prevPhase = getV17DeepDivePreviousPhase(routeType, phase);
    if (!prevPhase) return false;
    deep.phase = prevPhase;
    deep.sourceQuote = getV17DeepDiveRoundQuote(routeType, deep.round, null) || D.questionTextAtTime || '';
    if (deep.pendingRound) deep.pendingRound.sourceQuote = deep.sourceQuote;
    deep.finished = false;
    syncV17DeepDiveDrafts();
    setV17ScreenDirectWithoutHistoryReset(
      prevPhase === 'feel100' ? 's-v17-deep-feel-100' : 's-v17-deep-response'
    );
    renderV17Screen(cur);
    return true;
  }

  if (phase !== 'feel100') return false;
  deep.phase = 'current';
  deep.finished = false;
  if (deep.pendingRound) deep.pendingRound.feltHappiness100 = false;
  syncV17DeepDiveDrafts();
  setV17ScreenDirectWithoutHistoryReset('s-v17-deep-response');
  renderV17Screen(cur);
  return true;
}

    if (hasPendingText) deep.pendingRound.incomplete = true;

  deep.finished = true;

function handleV17Skip() {
  if (cur === 's-landing') { startLanding(); return; }
  if (cur === 's-v17-start-category') { openV17LifeThemeEntry(); return; }
  if (cur === 's-v17-entry-choice') { skipV17ThemeSelection(); return; }
  if (cur === 's-v17-spiritual-wisdom') { skipV17ThemeSelection(); return; }
  if (cur === 's-v17-before') {
    v17MeasurementSkipPhase = 'before';
    setV17MeasurementState('before', 'skipped', null, true);
    submitV17BeforeScore(getV17SkipScore(D.initialThemeScore));
    return;
  }
  if (cur === 's-v17-first-response') { submitV17FirstResponse(true); return; }
  if (cur === 's-v17-second-response') { submitV17SecondResponse(true); return; }
  if (cur === 's-v17-deep-response') { submitV17DeepDiveResponse(true); return; }
  if (cur === 's-v17-deep-feel-100') { submitV17DeepDiveFeel100(); return; }
  if (cur === 's-v17-breath') { completeV17BreathFlow(); return; }
  if (cur === 's-v17-final-measure') {
    v17MeasurementSkipPhase = 'after';
    setV17MeasurementState('after', 'skipped', null, true);
    submitV17FinalScore(getV17SkipScore(D.finalThemeScore));
    return;
  }
  if (cur === 's-result') { skipV17ResultChoice(); return; }
  showScreenDirect('s-v17-entry-choice');
}

  return trail;
}

function createV17ResultExportTrail(values, tone) {

  if (!list.length) list = [null];
  list.forEach(function(value, index) {
    var score = document.createElement('span');
    score.className = 'v17-result-export-score' + (tone === 'negative' ? ' is-negative' : '');

    if (value === V17_SCORE_NOT_A_PROBLEM || String(score.textContent || '').length > 6) {

    if (index < list.length - 1) {
      var arrow = document.createElement('span');

      exportRoot = createV17ResultExportCard();
      html2canvas(exportRoot, {
      scale: 1,
      width: 1080,
      height: 1350,
      backgroundColor: '#f4f5f2',
      useCORS: true,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      windowWidth: 1080,
      windowHeight: 1350
    }).then(function(canvas) {
      var previewWrap = document.getElementById('save-preview-wrap');
      var preview = document.getElementById('save-preview-img');
      if (previewWrap && preview) {
        preview.removeAttribute('src');
        previewWrap.style.display = 'none';
      }
      canvas.toBlob(function(blob) {
        if (!blob) {
          if (status) status.textContent = v17Copy('flow.result.imageError');
          return;
        }
        var url = URL.createObjectURL(blob);
        var file = null;
        try {
          file = new File([blob], 'noetune-v17-result.png', { type: 'image/png' });
        } catch (e) {
          file = null;
        }
        var finish = function() {
          setTimeout(function() { URL.revokeObjectURL(url); }, 1600);
          if (status) status.textContent = v17Copy('flow.result.imageReady');
        };
        var fallbackDownload = function() {
          var link = document.createElement('a');
          link.href = url;
          link.download = 'noetune-v17-result.png';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          finish();
        };
        if (navigator && typeof navigator.share === 'function' && file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            files: [file],
            title: v17Copy('app.name') || 'Noetune',
            text: v17Copy('flow.result.image')
          }).then(function() {
            finish();
          }).catch(function(error) {
            if (error && error.name === 'AbortError') return;
            fallbackDownload();
          });
        } else {
          fallbackDownload();
        }
      }, 'image/png', 1);
    }).catch(function() {
      if (status) status.textContent = v17Copy('flow.result.imageError');
    }).finally(function() {
      destroyV17ResultExportCard(exportRoot);
      if (button) {
        button.disabled = false;
        button.textContent = v17Copy('flow.result.image');
      }
    });
    } catch (error) {
      destroyV17ResultExportCard(exportRoot);
      if (status) status.textContent = v17Copy('flow.result.imageError');
      if (button) {
        button.disabled = false;
        button.textContent = v17Copy('flow.result.image');
      }
    }
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(capture);
  else capture();
}

goBack = function() {
  if (handleV17DeepDiveBack()) {
    if (navPageStateHistory.length) navPageStateHistory.pop();

  if (returnToV17RepeatResult()) return;
  if (handleV17BreathBack()) {

function formatV13History() {
  var ideals = D.v13History
    .map(function(item) { return item.ideal || ''; })
    .filter(function(ideal) { return !!ideal; });
  var lines = [
    t('ui.resultThemeLabel'),
    t('ui.themeQuoteTemplate', '', { theme: D.v13OriginalTheme || getV13ThemeLabel() }),
    '',
    t('ui.resultEssenceLabel')
  ];
  if (ideals.length) {
    ideals.forEach(function(ideal) {
      lines.push('・' + ideal);
    });
  } else {
    lines.push('・' + t('ui.resultUnanswered'));

  return lines.join('\n');

var BREATH_NEXT = {'br1':'s-br2','br2':'s-br3','br3':'s-br4','br5':'s-after2'};

function startBreath(t) {
  if (breathing) return;
  breathing = true;
  trackEvent('breath_started', { step: t, lang: lang });
  var h = document.getElementById('hint-' + t); if (h) h.style.display = 'none';
  var c = document.getElementById('circle-' + t);
  c.classList.remove('pulse'); breathCount = 0;
  setTimeout(function(){ breathCycle(t, c); }, 600);
}

function breathCycle(t, c) {
  if (breathCount >= 1) {
    c.textContent = '✓'; c.className = 'breath-circle';
    setTimeout(function(){ afterBreath(t); }, 800); return;
  }
  c.textContent = v17Copy('flow.breath.inhale'); c.className = 'breath-circle inhale';
  setTimeout(function(){
    c.textContent = v17Copy('flow.breath.exhale'); c.className = 'breath-circle exhale';
    setTimeout(function(){ breathCount++; breathCycle(t, c); }, 4000);
  }, 3000);
}

function afterBreath(t) {
  breathing = false; breathCount = 0;
  trackEvent('breath_completed', { step: t, lang: lang });
  var next;
  if (t === 'br4') {
    next = (D.breathMode === 'soft' || D.breathMode === 'deep') ? 's-br5' : 's-after2';
  } else {
    next = BREATH_NEXT[t];
  }
  if (next) {
    fwd(next);
    setTimeout(function(){
      ['br1','br2','br3','br4','br5'].forEach(function(k){
        var c = document.getElementById('circle-' + k);
        if (c) { c.textContent = ''; c.className = 'breath-circle pulse'; }
        var h = document.getElementById('hint-' + k); if (h) h.style.display = '';
      });
    }, 150);
  }
}

function resultText(id) {
  var el = document.getElementById(id);
  return el ? (el.textContent || '').trim() : '';

function getPendingResult() {
  try {
    var raw = sessionStorage.getItem('noetunePendingResult');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function setPendingResult(payload) {
  try { sessionStorage.setItem('noetunePendingResult', JSON.stringify(payload)); } catch(e) {}
}

function clearPendingResult() {
  try { sessionStorage.removeItem('noetunePendingResult'); } catch(e) {}
}

function renderResultSaveUI() {
  var button = document.getElementById('btn-save-result');
  var status = document.getElementById('save-result-status');
  if (!button || !status) return;
  var isV17 = !!D.v17Flow;
  var buttonKey = _resultSaveState === 'login' ? 'saveLogin'
    : _resultSaveState === 'saved' ? 'saved' : 'save';
  var statusKey = _resultSaveState === 'saving' ? 'saving'
    : _resultSaveState === 'saved' ? 'saved'
    : _resultSaveState === 'login' ? 'saveLogin'
    : _resultSaveState === 'error' ? 'saveError' : '';
  button.textContent = isV17 ? v17Copy('flow.result.' + buttonKey) : T(
    buttonKey === 'saveLogin' ? 'saveResultLogin'
      : buttonKey === 'saved' ? 'saveResultSaved' : 'saveResultButton'
  );
  button.disabled = _resultSaveState === 'saving' || _resultSaveState === 'saved';
  status.textContent = statusKey
    ? (isV17 ? v17Copy('flow.result.' + statusKey) : T(
      statusKey === 'saving' ? 'saveResultSaving'
        : statusKey === 'saved' ? 'saveResultSaved'
        : statusKey === 'saveLogin' ? 'saveResultLogin' : 'saveResultError'
    ))
    : '';
}

function setResultSaveState(state) {
  _resultSaveState = state;
  renderResultSaveUI();
  renderV16ResultSaveStatus(state);
}

function resetResultSaveUI() {
  _resultSaveInFlight = false;
  setResultSaveState('idle');
}

function showResultSaveToast(message) {
  var toast = document.getElementById('save-result-toast');
  if (!toast) return;
  toast.textContent = D.v17Flow
    ? (message === T('saveResultError') ? v17Copy('flow.result.saveError') : v17Copy('flow.result.saved'))
    : message;
  toast.classList.add('show');
  if (_saveResultToastTimer) clearTimeout(_saveResultToastTimer);
  _saveResultToastTimer = setTimeout(function() { toast.classList.remove('show'); }, 3200);
}

function openResultSaveAuth(payload) {
  setPendingResult(payload);
  setResultSaveState('login');
  openV17AuthModal();
  var loginCopy = D.v17Flow ? v17Copy('flow.result.saveLogin') : T('saveResultLogin');
  setEl('auth-modal-title', loginCopy);
  setEl('auth-modal-body', loginCopy);
}

function applyV17QuestionSnapshotToPayload(payload) {
  var snapshot = getV17QuestionSnapshot();
  if (!payload || !snapshot) return payload;
  var flowSnapshot = D.v17Flow ? JSON.parse(JSON.stringify(D.v17Flow)) : null;
  payload.appVersion = 'v17';
  payload.questionId = snapshot.questionId;
  payload.themeId = snapshot.themeId;
  payload.questionTextAtTime = snapshot.questionTextAtTime;
  payload.localeAtTime = snapshot.localeAtTime;
  payload.freeInputTheme = snapshot.freeInputTheme;
  payload.themeSource = snapshot.themeSource;
  payload.themeCategoryId = snapshot.themeCategoryId;
  payload.themeCategoryLabelAtTime = snapshot.themeCategoryLabelAtTime;
  payload.themeTrackId = snapshot.themeTrackId;
  payload.themeMeaning = snapshot.themeMeaning;
  if (!payload.themeKey) payload.themeKey = snapshot.themeId || snapshot.questionId;
  if (!payload.selectedThemeKey) payload.selectedThemeKey = snapshot.themeId || snapshot.questionId;
  payload.themeLabel = snapshot.questionTextAtTime;
  payload.language = payload.language || lang;
  if (payload.progressData && typeof payload.progressData === 'object') {
    payload.progressData.hcqSnapshot = snapshot;
    payload.progressData.v17Flow = flowSnapshot;
  }
  if (payload.userAnswers && typeof payload.userAnswers === 'object') {
    payload.userAnswers.hcqSnapshot = snapshot;
    payload.userAnswers.v17Flow = flowSnapshot;
    payload.userAnswers.beforeEmotionPositive = D.beforeEmotionPositive;
    payload.userAnswers.afterEmotionPositive = D.afterEmotionPositive;
  }
  if (payload.resultCardData && typeof payload.resultCardData === 'object') {
    payload.resultCardData.hcqSnapshot = snapshot;
    payload.resultCardData.beforeEmotionPositive = D.beforeEmotionPositive;
    payload.resultCardData.afterEmotionPositive = D.afterEmotionPositive;
    payload.resultCardData.initialThemeScore = D.beforeEmotionPositive;
    payload.resultCardData.finalThemeScore = D.afterEmotionPositive;
    payload.resultCardData.themeRoute = getV17ThemeRoute();
    payload.resultCardData.themeMeaning = D.themeMeaning || '';
    payload.resultCardData.step2Text = D.v17Flow ? D.v17Flow.step2Text : '';
    payload.resultCardData.step3Text = D.v17Flow ? D.v17Flow.step3Text : '';
    payload.resultCardData.currentState = D.currentState;
    payload.resultCardData.idealState = D.idealState;
  }
  return payload;
}

function wrapV17SavePayloadBuilders() {
  if (typeof window.buildCurrentProgressPayload === 'function' && !window.buildCurrentProgressPayload._v17Wrapped) {
    var baseBuildCurrentProgressPayload = window.buildCurrentProgressPayload;
    window.buildCurrentProgressPayload = function() {
      return applyV17QuestionSnapshotToPayload(baseBuildCurrentProgressPayload());
    };
    window.buildCurrentProgressPayload._v17Wrapped = true;
  }
  if (typeof window.buildCurrentResultPayload === 'function' && !window.buildCurrentResultPayload._v17Wrapped) {
    var baseBuildCurrentResultPayload = window.buildCurrentResultPayload;
    window.buildCurrentResultPayload = function() {
      return applyV17QuestionSnapshotToPayload(baseBuildCurrentResultPayload());
    };
    window.buildCurrentResultPayload._v17Wrapped = true;
  }
  if (typeof window.resumeSavedProgress === 'function' && !window.resumeSavedProgress._v17Wrapped) {
    var baseResumeSavedProgress = window.resumeSavedProgress;
    window.resumeSavedProgress = function() {
      var result = baseResumeSavedProgress.apply(this, arguments);
      var snapshot = _savedProgress && _savedProgress.progressData ? _savedProgress.progressData.hcqSnapshot : null;
      if (snapshot) {
        ensureV17QuestionState();
        D.questionId = snapshot.questionId || null;
        D.themeId = snapshot.themeId || null;
        D.questionTextAtTime = snapshot.questionTextAtTime || '';
        D.localeAtTime = snapshot.localeAtTime || lang || 'ja';
        D.freeInputTheme = snapshot.freeInputTheme || '';
        D.themeSource = snapshot.themeSource || (D.questionId ? 'hcq' : 'freeInput');
        D.themeCategoryId = snapshot.themeCategoryId || '';
        D.themeCategoryLabelAtTime = snapshot.themeCategoryLabelAtTime || '';
        D.themeTrackId = snapshot.themeTrackId || '';
        D.themeMeaning = snapshot.themeMeaning || '';
        if (D.questionTextAtTime) {
          D.themeKey = D.themeId || D.questionId;
          D.theme = D.questionTextAtTime;
          D.themePositive = D.questionTextAtTime;
          D.themeNegative = '';
          themeChosen = true;
        }
      }
      return result;
    };
    window.resumeSavedProgress._v17Wrapped = true;
  }

  function resumeV17RegularSnapshotToScreen(snapshot) {
    if (!window.NoetuneV17SessionSnapshot || typeof window.NoetuneV17SessionSnapshot.validateV17SessionSnapshot !== 'function') {
      return { ok: false, error: { code: 'RESTORE_SNAPSHOT_INVALID', path: 'snapshot' } };
    }
    var validated = window.NoetuneV17SessionSnapshot.validateV17SessionSnapshot(snapshot);
    if (!validated.ok) return { ok: false, error: { code: 'RESTORE_SNAPSHOT_INVALID', path: validated.error && validated.error.path ? validated.error.path : 'snapshot' } };
    snapshot = validated.snapshot;
    if (!snapshot || !snapshot.summary || snapshot.summary.sessionMode !== 'regular') {
      return { ok: false, error: { code: 'RESTORE_SCREEN_NOT_SUPPORTED', path: 'summary.sessionMode' } };
    }
    if (['s-v17-session-mode', 's-v17-before', 's-v17-first-response', 's-v17-second-response'].indexOf(snapshot.currentScreen) < 0) {
      return { ok: false, error: { code: 'RESTORE_SCREEN_NOT_SUPPORTED', path: 'currentScreen' } };
    }
    var restoreResult = window.NoetuneV17SessionSnapshot.restoreV17SessionRuntime(snapshot);
    if (!restoreResult.ok) return restoreResult;
    if (snapshot.currentScreen === 's-v17-session-mode') {
      renderV17SessionModeScreen();
    } else {
      renderV17Screen(snapshot.currentScreen);
    }
    setV17ScreenDirectWithoutHistoryReset(snapshot.currentScreen);
    if (D && D.v17Flow) D.v17Flow.currentScreen = snapshot.currentScreen;
    return {
      ok: true,
      sessionId: snapshot.sessionId,
      currentScreen: snapshot.currentScreen,
      sessionMode: 'regular'
    };
  }

  window.resumeV17RegularSnapshotToScreen = resumeV17RegularSnapshotToScreen;
}

document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return;
  if (e.isComposing || e.keyCode === 229) return;
  if (!e.target || e.target.tagName !== 'TEXTAREA') e.preventDefault();
});
async function initializeApp() {
  ensureV17QuestionState();
  wrapV17SavePayloadBuilders();
  applyThemeMode();
  await loadV17FlowCopy();
  loadV17ThemeLibrary();
  await setLandingLang(landingLang);
  updateProgress();
  initV17Auth();
}
initializeApp();
