<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
:root{--header-safe-height:8.5rem}
body{font-family:'Noto Serif JP','Helvetica Neue',-apple-system,sans-serif;background:#FAFAF7;color:#1A1A1A}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--header-safe-height) + env(safe-area-inset-top)) 1.8rem 2.5rem;opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen-scroll{justify-content:flex-start;align-items:center;overflow-y:auto;padding-top:calc(var(--header-safe-height) + env(safe-area-inset-top));padding-bottom:calc(5.5rem + env(safe-area-inset-bottom))}
.screen-scroll>*{flex-shrink:0}
.screen.active{opacity:1;transform:translateY(0);pointer-events:all}
.screen.exit{opacity:0;transform:translateY(-12px)}
.progress-bar{position:fixed;top:0;left:0;height:2px;background:#6B9080;width:0;transition:width .6s cubic-bezier(.4,0,.2,1);z-index:100;opacity:.7}
.btn-back{position:fixed;top:calc(1rem + env(safe-area-inset-top));left:1rem;width:40px;height:40px;background:rgba(250,250,247,.72);border:1px solid rgba(107,144,128,.12);border-radius:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:1;pointer-events:auto;transition:opacity .3s,background .2s;z-index:220;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn-back.visible{opacity:1;pointer-events:auto}
.btn-back svg{display:block}
.btn-back:active svg path{stroke:#6B9080}
.v17-session-bookmark{position:fixed;top:calc(1rem + env(safe-area-inset-top));right:1rem;min-width:40px;height:40px;padding:0 .75rem;background:rgba(250,250,247,.72);border:1px solid rgba(107,144,128,.12);border-radius:20px;color:#77736E;font-family:'Noto Serif JP',serif;font-size:.7rem;letter-spacing:.04em;cursor:default;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s,background .2s,border-color .2s;z-index:220;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.v17-session-bookmark.visible{opacity:1;pointer-events:auto}
.v17-session-bookmark:focus-visible{outline:2px solid #6B9080;outline-offset:3px}
.v17-session-bookmark[aria-pressed="true"]{border-color:#6B9080;background:rgba(107,144,128,.12);color:#1A1A1A}
.btn-v17-skip{
  display:none;
  width:fit-content;
  max-width:100%;
  margin:1.15rem auto 0;
  padding:0;
  border:0;
  background:none;
  box-shadow:none;
  color:#77736E;
  font-family:\'Noto Serif JP\',serif;
  font-size:.68rem;
  font-weight:300;
  line-height:1.45;
  letter-spacing:.08em;
  text-align:center;
  cursor:pointer;
  opacity:.66;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  transition:opacity .2s,color .2s;
}
.btn-v17-skip:active{color:#6B9080;opacity:.9}
.theme-mode-btn{position:static;min-width:58px;height:32px;padding:0 10px;border:1px solid rgba(107,144,128,.28);border-radius:18px;background:rgba(250,250,247,.82);color:#77736E;font-family:\'Noto Serif JP\',serif;font-size:.65rem;letter-spacing:.04em;cursor:pointer;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(8px);transition:background .2s,color .2s,border-color .2s}
.theme-mode-btn:active{color:#6B9080;border-color:#6B9080}
.settings-cluster{position:fixed;top:calc(4rem + env(safe-area-inset-top));right:1rem;z-index:210;display:flex;align-items:center;gap:6px}
.language-control,.account-control{position:relative}
.language-chip,.account-chip{height:30px;min-width:82px;padding:0 10px;border:1px solid rgba(109,185,183,.32);border-radius:18px;background:linear-gradient(120deg,rgba(255,255,255,.62),rgba(221,244,242,.44),rgba(235,225,249,.48));box-shadow:0 6px 20px rgba(90,145,150,.1),inset 0 1px 0 rgba(255,255,255,.72),0 0 14px rgba(135,214,209,.1);color:#657674;font-family:\'Noto Serif JP\',serif;font-size:.63rem;letter-spacing:.03em;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.account-chip{min-width:70px}
.language-chip-arrow{display:inline-block;margin-left:4px;font-size:.58rem;transition:transform .2s}
.language-chip[aria-expanded="true"] .language-chip-arrow,.account-chip[aria-expanded="true"] .language-chip-arrow{transform:rotate(180deg)}
.language-menu,.account-menu{position:absolute;top:calc(100% + 7px);right:0;width:140px;padding:6px;border:1px solid rgba(109,185,183,.25);border-radius:16px;background:rgba(248,252,251,.9);box-shadow:0 14px 34px rgba(67,108,120,.13),inset 0 1px 0 rgba(255,255,255,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.account-menu{width:164px}
.language-menu[hidden],.account-menu[hidden],.account-menu button[hidden]{display:none}
.language-menu button,.account-menu button{display:block;width:100%;padding:9px 10px;border:0;border-radius:11px;background:transparent;color:#50605e;font-family:\'Noto Serif JP\',serif;font-size:.7rem;letter-spacing:.04em;text-align:left;cursor:pointer}
.language-menu button:active,.language-menu button.selected,.account-menu button:active{background:linear-gradient(120deg,rgba(190,230,224,.42),rgba(224,214,243,.34));color:#315753}
.account-menu-separator{height:1px;margin:4px 8px;background:rgba(109,185,183,.16)}
.lang-select-wrap{display:flex;flex-direction:column;gap:1rem;margin-top:2.2rem;width:100%;max-width:220px;align-items:center}
.lang-btn{font-family:\'Noto Serif JP\',serif;width:100%;padding:13px 0;background:transparent;color:#1A1A1A;border:1.5px solid rgba(200,200,195,.45);border-radius:30px;font-size:.95rem;letter-spacing:.1em;cursor:pointer;transition:background .2s,border-color .2s}
.lang-btn:active{background:rgba(107,144,128,.1);border-color:#6B9080}
.intro-title{font-family:\'Noto Serif JP\',serif;font-size:2.8rem;font-weight:700;letter-spacing:.15em;color:#1A1A1A;margin-bottom:.3rem}
.intro-sub{font-size:.76rem;color:#A8A8A2;letter-spacing:.2em;margin-bottom:2.8rem}
.screen-title{font-family:\'Noto Serif JP\',serif;font-size:.97rem;font-weight:300;letter-spacing:.04em;text-align:center;line-height:2;margin-bottom:1.5rem;max-width:300px;color:#1A1A1A;white-space:pre-line}
.text-input{font-family:\'Noto Serif JP\',serif;font-size:1rem;font-weight:300;text-align:center;border:none;border-bottom:1.5px solid #D4DDD8;background:transparent;padding:.7rem 1rem;width:92%;max-width:320px;outline:none;color:#1A1A1A;transition:border-color .3s}
.text-input:focus{border-bottom-color:#6B9080}
.text-input::placeholder{color:#CCC;font-weight:300}
.measure-problem{font-family:\'Noto Serif JP\',serif;font-size:.93rem;font-weight:400;color:#1A1A1A;text-align:center;letter-spacing:.03em;margin-bottom:1.4rem;max-width:300px;line-height:1.75;white-space:pre-line}
.slider-wrap{width:100%;max-width:280px;display:flex;flex-direction:column;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:#D4DDD8;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;background:#6B9080;border-radius:50%;cursor:pointer;box-shadow:0 2px 8px rgba(107,144,128,.3)}
input[type=range]::-moz-range-thumb{width:32px;height:32px;background:#6B9080;border-radius:50%;cursor:pointer;border:none}
.slider-labels{display:flex;justify-content:space-between;width:100%;margin-top:.6rem;font-size:.7rem;color:#BBB}
.score-num{font-family:\'Noto Serif JP\',serif;font-size:2.6rem;font-weight:700;line-height:1;margin-bottom:1.6rem;color:#C47A5A;letter-spacing:.02em;visibility:hidden;min-height:2.6rem;display:flex;align-items:center;justify-content:center}
.score-num.shown{visibility:visible}
.btn{font-family:\'Noto Serif JP\',serif;margin-top:2rem;padding:14px 52px;background:#6B9080;color:#fff;border:none;border-radius:30px;font-size:.95rem;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 18px rgba(107,144,128,.22);transition:opacity .3s,transform .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.btn-ghost{font-family:\'Noto Serif JP\',serif;margin-top:.5rem;padding:8px 22px;background:transparent;color:#8F8F88;border:none;border-radius:30px;font-size:.74rem;letter-spacing:.1em;cursor:pointer;transition:color .25s}
.btn-ghost:active{color:#6B9080}
.breath-sub{font-family:\'Noto Serif JP\',serif;font-size:.82rem;font-weight:400;color:#8F8F88;text-align:center;letter-spacing:.08em;margin-bottom:.35rem}
.breath-main{font-family:\'Noto Serif JP\',serif;font-size:1rem;font-weight:400;color:#1A1A1A;text-align:center;letter-spacing:.03em;line-height:1.85;max-width:300px;margin-bottom:1.8rem;white-space:pre-line}
.screen .v16-question{color:#1A1A1A;white-space:pre-line}
.v16-input-question{width:100%;max-width:340px;margin:0 auto 2rem;color:var(--text);font-family:\'Noto Serif JP\',serif;font-size:clamp(22px,4.8vw,30px);font-weight:400;line-height:1.8;letter-spacing:.06em;text-align:center}
.v16-input-question-verb{margin-bottom:1.4rem}
.v16-input-question-copy{font-size:.93rem;white-space:pre-line}
.breath-hint{text-align:center;font-size:.82rem;color:#666660;letter-spacing:.08em;font-family:\'Noto Serif JP\',serif;pointer-events:none;margin-bottom:1.2rem}
.breath-circle{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#8BB5A2,#5A8A72);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.92);font-family:\'Noto Serif JP\',serif;font-size:1.4rem;font-weight:300;letter-spacing:.05em;transition:transform 3s cubic-bezier(.4,0,.2,1),box-shadow 3s ease;box-shadow:0 4px 30px rgba(107,144,128,.15);user-select:none;-webkit-user-select:none;margin-bottom:1.6rem;cursor:pointer}
.breath-circle.inhale{transform:scale(1.5);box-shadow:0 8px 50px rgba(107,144,128,.25);transition:transform 3s cubic-bezier(.4,0,.2,1),box-shadow 3s ease}
.breath-circle.exhale{transform:scale(1);transition:transform 4s cubic-bezier(.4,0,.2,1),box-shadow 4s ease}
@keyframes ntn-pulse{0%,100%{opacity:.55}50%{opacity:1}}
.breath-circle.pulse{animation:ntn-pulse 2.4s infinite}
.v17-step{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem 0}
.v17-theme-quote{font-family:\'Noto Serif JP\',serif;font-size:clamp(1.16rem,4.7vw,1.42rem);font-weight:400;line-height:1.75;letter-spacing:.035em;color:#1A1A1A;max-width:340px;margin-bottom:2rem;white-space:pre-line;text-wrap:balance}
.v17-step-copy{font-family:\'Noto Serif JP\',serif;font-size:.96rem;font-weight:300;line-height:2.05;letter-spacing:.035em;color:#625F5A;max-width:320px;margin-bottom:1.8rem;white-space:pre-line;text-wrap:balance}
.v17-step-helper{font-family:\'Noto Serif JP\',serif;font-size:.7rem;font-weight:300;line-height:1.8;letter-spacing:.05em;color:#A8A8A2;margin:.15rem 0 .8rem;white-space:pre-line}
.v17-breath-lead{font-family:\'Noto Serif JP\',serif;font-size:.92rem;font-weight:300;line-height:1.85;letter-spacing:.035em;color:#A8A8A2;margin-bottom:1.4rem}
.v17-breath-body{font-family:\'Noto Serif JP\',serif;font-size:.98rem;font-weight:600;color:#1A1A1A;line-height:2;letter-spacing:.035em;text-align:center;white-space:pre-line;max-width:320px;margin:0 auto 1.8rem;text-wrap:balance}
.v17-breath-hint{font-family:\'Noto Serif JP\',serif;font-size:.68rem;font-weight:300;color:#A8A8A2;letter-spacing:.06em;margin-bottom:1.5rem}
.v17-support-primary{font-size:.92rem;line-height:1.85;letter-spacing:.035em}
.v17-writing{font-family:\'Noto Serif JP\',serif;font-size:.94rem;font-weight:300;line-height:1.8;width:100%;max-width:330px;min-height:132px;padding:1rem 1.1rem;border:1px solid rgba(108,181,179,.24);border-radius:18px;background:rgba(255,255,255,.23);color:#1A1A1A;outline:none;resize:vertical;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 25px rgba(75,112,124,.045)}
.v17-writing:focus{border-color:rgba(83,191,186,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.64),0 0 0 3px rgba(108,211,205,.065),0 10px 28px rgba(75,142,148,.08)}
.v17-writing::placeholder{color:#AAA69F}
.v17-result-theme{font-family:\'Noto Serif JP\',serif;font-size:.9rem;line-height:1.75;color:#1A1A1A;letter-spacing:.03em;white-space:pre-line}
.v17-result-row{display:flex;align-items:center;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #EDEDE7}
.v17-result-row:last-child{border-bottom:none}
.v17-result-label{font-family:\'Noto Serif JP\',serif;font-size:.7rem;color:#77736E;letter-spacing:.12em}
.v17-result-value{font-family:\'Noto Serif JP\',serif;font-size:1.05rem;color:#6B9080;font-weight:600}
.v17-result-brand{font-family:\'Noto Serif JP\',serif;font-size:.88rem;font-weight:500;letter-spacing:.08em;color:#1A1A1A;text-align:center;margin-bottom:1.1rem}
.v17-result-happiness-label{font-family:\'Noto Serif JP\',serif;font-size:.72rem;color:#77736E;line-height:1.8;letter-spacing:.04em;margin:1.1rem 0 .55rem;text-align:left}
.v17-result-score-flow{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;padding:.2rem 0 .2rem;max-width:100%}
.v17-result-score-pair{display:flex;flex-direction:column;align-items:center;gap:.25rem}
.v17-result-score-point{display:flex;align-items:baseline;justify-content:center;gap:1.2rem;min-width:150px}
.v17-result-score-point span{font-family:\'Noto Serif JP\',serif;font-size:.68rem;color:#A8A8A2;letter-spacing:.14em}
.v17-result-score-point strong{font-family:\'Noto Serif JP\',serif;font-size:1.55rem;color:#6B9080;font-weight:500}
.v17-result-score-arrow{font-size:.8rem;color:#B8B8B0;line-height:1.2}
.v17-result-score-trail{display:flex;align-items:center;justify-content:flex-start;gap:.65rem;max-width:100%;padding:.1rem 0 .35rem;flex-wrap:wrap;overflow:visible;scrollbar-width:none}
.v17-result-score-trail::-webkit-scrollbar{display:none}
.v17-result-score-trail[hidden],.v17-result-score-pair[hidden]{display:none}
.v17-result-score-item{display:inline-flex;align-items:center;gap:.65rem;flex:0 0 auto;font-family:\'Noto Serif JP\',serif;font-size:1.45rem;color:#6B9080;font-weight:500;line-height:1.4}
.v17-result-score-item:not(:last-child)::after{content:'→';font-size:.9rem;color:#B8B8B0;font-weight:300}
.v17-result-score-toggle{align-self:center;background:transparent;border:none;padding:0;margin:.05rem 0 0;font-family:\'Noto Serif JP\',serif;font-size:.68rem;letter-spacing:.08em;color:#8F8F88;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;text-align:center}
.v17-result-score-toggle:active{color:#6B9080}
.v17-result-score-toggle[hidden]{display:none}
.v17-result-divider{height:1px;background:#EDEDE7;margin:1.1rem 0 .95rem}
.v17-result-awareness-list{display:flex;flex-direction:column;gap:.42rem;padding:.08rem 0 0}
.v17-result-awareness-item{font-family:\'Noto Serif JP\',serif;font-size:.73rem;line-height:1.48;color:#1A1A1A;letter-spacing:.02em;white-space:pre-line;overflow-wrap:anywhere;word-break:break-word}
.v17-result-awareness-toggle{align-self:flex-start;background:transparent;border:none;padding:0;margin:.7rem 0 0;font-family:\'Noto Serif JP\',serif;font-size:.68rem;letter-spacing:.08em;color:#8F8F88;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s}
.v17-result-awareness-toggle:active{color:#6B9080}
.v17-result-awareness-toggle[hidden]{display:none}
.v17-result-site{font-family:\'Noto Serif JP\',serif;font-size:.72rem;letter-spacing:.12em;color:#8F8F88;text-align:center;padding-top:.1rem}
.v17-result-actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:.65rem;margin-top:1.3rem;padding-bottom:2rem}
.v17-result-action{width:100%;min-height:48px;border:1px solid rgba(107,144,128,.22);border-radius:16px;background:rgba(255,255,255,.18);color:#4F5E59;font-family:\'Noto Serif JP\',serif;font-size:.78rem;letter-spacing:.05em;cursor:pointer}
.v17-result-action.primary{background:#6B9080;color:#fff;border-color:#6B9080}
.v17-result-action:active{transform:scale(.985)}
.v17-image-status{min-height:1.4em;margin-top:.45rem;font-family:\'Noto Serif JP\',serif;font-size:.65rem;color:#8F8F88;letter-spacing:.04em;text-align:center}
.sc-card{width:100%;max-width:320px;background:#FAFAF7;border:1px solid #E8E8E2;border-radius:14px;padding:1.1rem 1.2rem .9rem;box-sizing:border-box;margin-bottom:.5rem}
.sc-card-header{text-align:center;margin-bottom:.35rem}

.sc-card-badge{font-family:\'Noto Serif JP\',serif;font-size:.58rem;color:#A8A8A2;letter-spacing:.22em;margin-top:.1rem}
.sc-card-poem{font-family:\'Noto Serif JP\',serif;font-size:.72rem;color:#A8A8A2;letter-spacing:.08em;text-align:center;margin-bottom:.7rem;line-height:1.5}
.sc-section-label{font-family:\'Noto Serif JP\',serif;font-size:.6rem;color:#A8A8A2;letter-spacing:.18em;margin-bottom:.2rem}
.sc-from-wrap{margin-bottom:.25rem}
.sc-from-value{font-family:\'Noto Serif JP\',serif;font-size:.88rem;color:#777770;letter-spacing:.04em;line-height:1.45}
.sc-down-arrow{color:#C8C8C2;font-size:.8rem;margin:.2rem 0}
.sc-toward-wrap{margin-bottom:.65rem}
.sc-toward-value{font-family:\'Noto Serif JP\',serif;font-size:.95rem;font-weight:500;color:#1A1A1A;letter-spacing:.03em;line-height:1.45}
.sc-shift-section{border-top:1px solid #EDEDE7;padding-top:.6rem}

.sc-shift-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid #EDEDE7}
.sc-shift-row-last{border-bottom:none}
.sc-shift-row-left{flex:1;margin-right:.5rem}
.sc-shift-label{font-family:\'Noto Serif JP\',serif;font-size:.78rem;color:#444;letter-spacing:.04em;font-weight:500}

.sc-val-arrow{color:#C8C8C2;font-size:.82rem}
.sc-val-after{font-family:\'Noto Serif JP\',serif;font-size:.95rem;color:#6B9080;font-weight:600}
.sc-meaning{font-family:\'Noto Serif JP\',serif;font-size:.65rem;color:#A8A8A2;letter-spacing:.04em;line-height:1.6;margin-top:.6rem;padding-top:.6rem;border-top:1px solid #EDEDE7}
.sc-card-footer{font-family:\'Noto Serif JP\',serif;font-size:.58rem;color:#C8C8C2;letter-spacing:.12em;text-align:center;margin-top:.6rem}
.sc-note-wrap{padding-top:.6rem;margin-top:.6rem;border-top:1px solid #EDEDE7}
.sc-note-value{font-family:\'Noto Serif JP\',serif;font-size:.85rem;color:#1A1A1A;font-weight:400;letter-spacing:.03em;margin-top:.15rem;line-height:1.5}

/* ── QUIET HOLOGRAPHIC SURFACE ── */
body{
  background:
    radial-gradient(ellipse at 50% -12%,rgba(210,236,248,.46) 0%,rgba(238,245,244,.18) 35%,transparent 64%),
    radial-gradient(ellipse at -8% 86%,rgba(184,226,217,.2) 0%,transparent 45%),
    radial-gradient(ellipse at 108% 76%,rgba(214,201,238,.2) 0%,transparent 46%),
    linear-gradient(160deg,#fbfcfa 0%,#f5f9f8 48%,#f8f6fb 100%);
}
body::before{
  content:'';position:fixed;inset:-12%;pointer-events:none;z-index:-1;
  background:
    radial-gradient(circle at 22% 24%,rgba(190,229,237,.22) 0%,transparent 30%),
    radial-gradient(circle at 78% 68%,rgba(205,190,237,.17) 0%,transparent 31%),
    radial-gradient(circle at 42% 92%,rgba(171,224,210,.16) 0%,transparent 34%);
  opacity:.72;transform:translate3d(0,0,0) scale(1.02);
  animation:hologramDrift 16s ease-in-out infinite alternate;
  will-change:transform,opacity;

<script>
var homeScreenInstallPromptEvent = null;

if (typeof window !== 'undefined') {
  window.addEventListener('beforeinstallprompt', function(event) {
    event.preventDefault();
    homeScreenInstallPromptEvent = event;
  });
  window.addEventListener('appinstalled', function() {
    homeScreenInstallPromptEvent = null;
  });
}

function isV17IOSDevice() {
  var ua = navigator.userAgent || '';
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function isV17AndroidDevice() {
  var ua = navigator.userAgent || '';
  return /Android/.test(ua);
}

function renderHomeScreenInstallCopy() {
  if (!getV17LocaleRoot()) return;
  setEl('btn-home-screen-add-lp', v17Copy('lp.homeScreen.cta'));
  setEl('lp-home-screen-note', v17Copy('lp.homeScreen.body'));
  setEl('btn-home-screen-add-result', v17Copy('lp.homeScreen.cta'));
  setEl('result-home-screen-note', v17Copy('lp.homeScreen.body'));
  setEl('home-screen-modal-title', v17Copy('lp.homeScreen.modalTitle'));
  setEl('home-screen-ios-title', v17Copy('lp.homeScreen.iphoneTitle'));
  setEl('home-screen-ios-body', v17Copy('lp.homeScreen.iphoneBody'));
  setEl('home-screen-android-title', v17Copy('lp.homeScreen.androidTitle'));
  setEl('home-screen-android-body', v17Copy('lp.homeScreen.androidBody'));
  setEl('home-screen-desktop-title', v17Copy('lp.homeScreen.desktopTitle'));
  setEl('home-screen-desktop-body', v17Copy('lp.homeScreen.desktopBody'));
  setEl('btn-home-screen-modal-close', v17Copy('lp.homeScreen.close'));
}

function openHomeScreenInstallModal() {
  renderHomeScreenInstallCopy();
  var modal = document.getElementById('home-screen-modal');
  if (modal) modal.classList.add('open');
}

function closeHomeScreenInstallModal() {
  var modal = document.getElementById('home-screen-modal');
  if (modal) modal.classList.remove('open');
}

function openHomeScreenInstallPrompt() {
  if (isV17AndroidDevice() && homeScreenInstallPromptEvent && typeof homeScreenInstallPromptEvent.prompt === 'function') {
    var promptEvent = homeScreenInstallPromptEvent;
    homeScreenInstallPromptEvent = null;
    promptEvent.prompt();
    if (promptEvent.userChoice && typeof promptEvent.userChoice.then === 'function') {
      promptEvent.userChoice.then(function() {}, function() {});
    }
    return;
  }
  openHomeScreenInstallModal();
}

function applyThemeMode() {
  var root = document.documentElement;
  var darkStyles = document.getElementById('dark-theme-styles');
  if (themeMode === 'auto') {
    root.removeAttribute('data-theme');
    if (darkStyles) darkStyles.media = '(prefers-color-scheme: dark)';
  } else {
    root.dataset.theme = themeMode;
    if (darkStyles) darkStyles.media = themeMode === 'dark' ? 'all' : 'not all';
  }
  var button = document.getElementById('btn-theme-mode');
  if (button) {
    var locale = typeof getV17LocaleRoot === 'function' ? getV17LocaleRoot() : null;
    var appearance = locale && locale.appearance ? locale.appearance : null;
    var label = appearance ? appearance.label : '';
    var modeLabel = appearance ? appearance[themeMode] : '';
    button.textContent = modeLabel;
    button.setAttribute('aria-label', label && modeLabel ? label + ': ' + modeLabel : '');
    button.title = label;
  }
}

function cycleThemeMode() {
  themeMode = themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto';
  try { localStorage.setItem('noetuneThemeMode', themeMode); } catch(e) {}
  applyThemeMode();
}

function updateLanguageControl() {
  var code = lang || landingLang || 'en';
  var locale = typeof getV17LocaleRoot === 'function' ? getV17LocaleRoot() : null;
  var languageNames = locale && locale.languages ? locale.languages : {};
  setEl('current-language-name', languageNames[code] || '');
  document.querySelectorAll('#language-menu [data-language]').forEach(function(button) {
    button.textContent = languageNames[button.dataset.language] || '';
    button.classList.toggle('selected', button.dataset.language === code);
  });
}

function toggleLanguageMenu() {
  var menu = document.getElementById('language-menu');
  var chip = document.getElementById('btn-language-chip');
  if (!menu || !chip) return;
  closeAccountMenu();
  var willOpen = menu.hidden;
  menu.hidden = !willOpen;
  chip.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}

function toggleAccountMenu() {
  var menu = document.getElementById('account-menu');
  var chip = document.getElementById('btn-account-chip');
  if (!menu || !chip) return;
  closeLanguageMenu();
  var willOpen = menu.hidden;
  menu.hidden = !willOpen;
  chip.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
}

function closeAccountMenu() {
  var menu = document.getElementById('account-menu');
  var chip = document.getElementById('btn-account-chip');
  if (menu) menu.hidden = true;
  if (chip) chip.setAttribute('aria-expanded', 'false');
}

function getAccountUIState() {
  if (!currentUser) return 'guest';
  return isUnlimited() ? 'plus' : 'free';
}

function updateAccountActions() {
  var state = getAccountUIState();
  var login = document.getElementById('account-login');
  var signup = document.getElementById('account-signup');
  var professional = document.getElementById('account-professional');
  var manage = document.getElementById('account-manage');
  var logout = document.getElementById('account-logout');
  var separator = document.getElementById('account-menu-separator');
  if (login) login.hidden = state !== 'guest';
  if (signup) signup.hidden = state !== 'guest';
  if (professional) professional.hidden = state !== 'free';
  if (manage) manage.hidden = state !== 'plus';
  if (logout) logout.hidden = state === 'guest';
  if (separator) separator.hidden = state === 'guest';
  var upgrade = document.getElementById('result-upgrade-block');
  if (upgrade) upgrade.style.display = state === 'plus' ? 'none' : '';
  if (typeof updatePricingAccountState === 'function') updatePricingAccountState();
}

function openAccountAuth(signup) {
  closeAccountMenu();
  openV17AuthModal();
  if (getV17LocaleRoot()) {
    var actionCopy = v17Copy(signup ? 'flow.app.signup' : 'flow.app.login');
    setEl('auth-modal-title', actionCopy);
    setEl('auth-modal-body', actionCopy);
    setGoogleAuthButtonLabel(document.getElementById('auth-google-btn'));
  } else if (signup) {
    setEl('auth-modal-title', T('signup'));
  }
}

function closeLanguageMenu() {
  var menu = document.getElementById('language-menu');
  var chip = document.getElementById('btn-language-chip');
  if (menu) menu.hidden = true;
  if (chip) chip.setAttribute('aria-expanded', 'false');
}

function renderResultProfessionalFeatures() {
  var el = document.getElementById('result-professional-features');
  if (!el) return;
  var features = t('ui.resultProfessionalFeatures', []);
  el.innerHTML = '';
  features.forEach(function(text) {
    var line = document.createElement('div');
    line.textContent = text;
    el.appendChild(line);
  });
}

function normalizeWishGroups(groups) {
  return (groups || []).map(function(group) {
    group.id = group.key;
    group.wishes = (group.wishes || []).map(function(wish) {
      wish.id = wish.key;
      wish.themes = wish.themes || [];
      return wish;
    });
    return group;
  });
}

function getWishGroups() {
  return currentLocale && currentLocale.wishGroups ? currentLocale.wishGroups : [];
}

function findWishGroup(groupKey) {
  var groups = getWishGroups();
  for (var i = 0; i < groups.length; i++) if (groups[i].key === groupKey) return groups[i];
  return null;
}

function findWish(groupKey, wishKey) {
  var group = findWishGroup(groupKey);
  if (!group || !group.wishes) return null;
  for (var i = 0; i < group.wishes.length; i++) if (group.wishes[i].key === wishKey) return group.wishes[i];
  return null;
}

function getV16VerbList(key) {
  var verbs = getText('ui.' + key, []);
  return Array.isArray(verbs) ? verbs : [];
}

var v16VerbCategoryState = {};

function normalizeV16Verb(verb) {
  if (!verb) return null;
  if (typeof verb === 'string') return { id: verb, label: verb };
  if (typeof verb === 'object') {
    var label = verb.label || verb.title || verb.text || verb.id || '';
    if (!label) return null;
    return { id: verb.id || label, label: label };
  }
  return null;
}

function getV16VerbCategories(listKey, categoriesKey, titleKey) {
  var categories = categoriesKey ? getText('ui.' + categoriesKey, []) : getText('ui.' + listKey, []);
  if (Array.isArray(categories) && categories.length && typeof categories[0] === 'object' && Array.isArray(categories[0].verbs)) {
    return categories;
  }
  var verbs = getV16VerbList(listKey).map(normalizeV16Verb).filter(Boolean);
  return verbs.length ? [{ id: 'all', title: T(titleKey), verbs: verbs }] : [];
}

function getV16VerbCategoryTitle(category) {
  var title = category.title || category.label || '';
  return category.emoji && title.indexOf(category.emoji) !== 0 ? category.emoji + ' ' + title : title;
}

function getV16VerbCategoryKey(gridId, categoryId) {
  return gridId + ':' + categoryId;
}

function makeV16VerbButton(verb) {
  var normalized = normalizeV16Verb(verb);
  if (!normalized) return null;
  var button = document.createElement('button');
  button.type = 'button';
  button.className = 'theme-btn';
  button.textContent = normalized.label;
  button.dataset.v16Verb = normalized.label;
  button.addEventListener('click', function() { selectV16Verb(normalized.label); });
  return button;
}

function renderV16VerbCategoryItems(gridId, category) {
  var categoryId = category.id || category.title || 'category';
  var key = getV16VerbCategoryKey(gridId, categoryId);
  var grid = document.getElementById('v16-verb-grid-' + key);
  var more = document.getElementById('v16-verb-more-' + key);
  if (!grid || !more) return;
  clearChildren(grid);
  var verbs = Array.isArray(category.verbs) ? category.verbs : [];
  var pageSize = v16VerbCategoryState[gridId + ':pageSize'] || 2;
  var visible = Math.min(v16VerbCategoryState[key] || pageSize, verbs.length);
  for (var i = 0; i < visible; i++) {
    var button = makeV16VerbButton(verbs[i]);
    if (button) grid.appendChild(button);
  }
  more.style.display = visible < verbs.length ? '' : 'none';
}

function seeMoreV16VerbCategory(gridId, categoryId) {
  var categories = v16VerbCategoryState[gridId + ':categories'] || [];
  var category = null;
  for (var i = 0; i < categories.length; i++) {
    if ((categories[i].id || categories[i].title || 'category') === categoryId) {
      category = categories[i];
      break;
    }
  }
  if (!category) return;
  var key = getV16VerbCategoryKey(gridId, categoryId);
  var pageSize = v16VerbCategoryState[gridId + ':pageSize'] || 2;
  v16VerbCategoryState[key] = (v16VerbCategoryState[key] || pageSize) + pageSize;
  renderV16VerbCategoryItems(gridId, category);
}

function toggleV16VerbCategory(gridId, categoryId) {
  var section = document.getElementById('v16-verb-cat-' + gridId + '-' + categoryId);
  if (!section) return;
  var isOpen = section.classList.toggle('open');
  var toggle = section.querySelector('.theme-section-toggle');
  if (toggle) toggle.textContent = isOpen ? '－' : '＋';
  var key = getV16VerbCategoryKey(gridId, categoryId);
  if (!isOpen) v16VerbCategoryState[key] = v16VerbCategoryState[gridId + ':pageSize'] || 2;
  renderV16VerbCategoryItems(gridId, v16VerbCategoryState[gridId + ':' + categoryId + ':category']);
}

function renderV16VerbAccordion(listKey, categoriesKey, gridId, titleKey, pageSize) {
  var wrap = document.getElementById(gridId);
  if (!wrap) return;
  clearChildren(wrap);
  var categories = getV16VerbCategories(listKey, categoriesKey, titleKey);
  v16VerbCategoryState[gridId + ':pageSize'] = pageSize || 2;
  v16VerbCategoryState[gridId + ':categories'] = categories;
  categories.forEach(function(category, index) {
    var categoryId = category.id || 'category-' + index;
    var key = getV16VerbCategoryKey(gridId, categoryId);
    v16VerbCategoryState[key] = v16VerbCategoryState[gridId + ':pageSize'];
    v16VerbCategoryState[gridId + ':' + categoryId + ':category'] = category;

    var section = document.createElement('div');
    section.className = 'theme-section v16-verb-category';
    section.id = 'v16-verb-cat-' + gridId + '-' + categoryId;

    var header = document.createElement('button');
    header.type = 'button';
    header.className = 'theme-section-header';
    header.addEventListener('click', function() { toggleV16VerbCategory(gridId, categoryId); });

    var labelWrap = document.createElement('span');
    labelWrap.className = 'theme-section-label-wrap';
    var label = document.createElement('span');
    label.className = 'theme-section-label';
    label.textContent = getV16VerbCategoryTitle(category);
    labelWrap.appendChild(label);
    if (category.age) {
      var age = document.createElement('span');
      age.className = 'v16-verb-category-age';
      age.textContent = category.age;
      labelWrap.appendChild(age);
    }
    if (category.description) {
      var desc = document.createElement('span');
      desc.className = 'theme-section-desc';
      desc.textContent = category.description;
      labelWrap.appendChild(desc);
    }

    var toggle = document.createElement('span');
    toggle.className = 'theme-section-toggle';
    toggle.textContent = '＋';
    header.appendChild(labelWrap);
    header.appendChild(toggle);

    var body = document.createElement('div');
    body.className = 'theme-section-body';
    var grid = document.createElement('div');
    grid.className = 'v16-verb-grid';
    grid.id = 'v16-verb-grid-' + key;
    body.appendChild(grid);
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'btn-see-more';
    more.id = 'v16-verb-more-' + key;
    more.textContent = T('v16VerbShowMore');
    more.addEventListener('click', function(e) {
      e.stopPropagation();
      seeMoreV16VerbCategory(gridId, categoryId);
    });
    body.appendChild(more);

    section.appendChild(header);
    section.appendChild(body);
    wrap.appendChild(section);
    renderV16VerbCategoryItems(gridId, category);
  });
}

var v16Breathing = false;
var v16BreathCount = 0;

function resetV16BreathScreens() {
  v16Breathing = false;
  v16BreathCount = 0;
  ['1', '2'].forEach(function(step) {
    var circle = document.getElementById('circle-v16-breath-' + step);
    var hint = document.getElementById('hint-v16-breath-' + step);
    var next = document.getElementById('btn-v16-breath-' + step + '-next');
    if (circle) { circle.textContent = ''; circle.className = 'breath-circle pulse'; }
    if (hint) { hint.textContent = T('breathe_start_hint'); hint.style.display = ''; }
    if (next) next.disabled = true;
  });
}

function startV16Breath(step) {
  if (v16Breathing) return;
  v16Breathing = true;
  v16BreathCount = 0;
  var hint = document.getElementById('hint-v16-breath-' + step);
  var circle = document.getElementById('circle-v16-breath-' + step);
  if (hint) hint.style.display = 'none';
  if (!circle) { v16Breathing = false; return; }
  circle.classList.remove('pulse');
  setTimeout(function() { runV16BreathCycle(step, circle); }, 600);
}

function runV16BreathCycle(step, circle) {
  if (v16BreathCount >= 1) {
    circle.textContent = '✓';
    circle.className = 'breath-circle';
    setTimeout(function() { completeV16Breath(step); }, 800);
    return;
  }
  circle.textContent = T('breath_in');
  circle.className = 'breath-circle inhale';
  setTimeout(function() {
    circle.textContent = T('breath_out');
    circle.className = 'breath-circle exhale';
    setTimeout(function() {
      v16BreathCount++;
      runV16BreathCycle(step, circle);
    }, 4000);
  }, 3000);
}

function completeV16Breath(step) {
  v16Breathing = false;
  v16BreathCount = 0;
  var next = document.getElementById('btn-v16-breath-' + step + '-next');
  if (next) next.disabled = false;
}

function formatV16Difference(before, after) {
  var diff = Number(before) - Number(after);
  if (!isFinite(diff)) return '';
  if (diff > 0) return '-' + diff;
  if (diff < 0) return '+' + Math.abs(diff);
  return '0';
}

function buildV16ResultPayload() {
  return {
    version: 'v16',
    verb: D.verb || '',
    before: D.v16NegativeBefore == null ? null : Number(D.v16NegativeBefore),
    after: D.v16NegativeAfter == null ? null : Number(D.v16NegativeAfter),
    difference: formatV16Difference(D.v16NegativeBefore, D.v16NegativeAfter),
    negativeInput: D.v16NegativeInput || '',
    idealInput: D.v16IdealInput || '',
    negativeAnswers: Array.isArray(D.v16NegativeAnswers) ? [...D.v16NegativeAnswers] : [],
    idealAnswers: Array.isArray(D.v16IdealAnswers) ? [...D.v16IdealAnswers] : [],

function createV17LandingSection(section) {
  var sectionEl = document.createElement('section');
  sectionEl.className = 'lp-section';
  if (section.label) {
    var label = document.createElement('div');
    label.className = 'lp-section-label';
    label.textContent = section.label;
    sectionEl.appendChild(label);
  }

  var title = document.createElement('h2');
  title.className = 'lp-section-title';
  title.textContent = section.title || '';

  var body = document.createElement('div');
  body.className = 'lp-section-body';
  var groups = Array.isArray(section.bodyGroups) ? section.bodyGroups : [section.body || ''];
  groups.forEach(function(group) {
    var paragraph = document.createElement('p');
    paragraph.className = 'lp-section-body-group';
    paragraph.textContent = group || '';
    body.appendChild(paragraph);
  });

  sectionEl.appendChild(title);
  sectionEl.appendChild(body);
  if (Array.isArray(section.items) && section.items.length) {
    var list = document.createElement('ul');
    list.className = 'lp-item-list';
    section.items.forEach(function(item) {
      var line = document.createElement('li');
      line.textContent = item || '';
      list.appendChild(line);
    });
    sectionEl.appendChild(list);
  }
  if (section.cta) {
    var actionWrap = document.createElement('div');
    actionWrap.className = 'lp-section-cta-wrap';
    var action = document.createElement('button');
    action.type = 'button';
    action.className = 'btn-lp-subtle';
    action.textContent = section.cta;
    action.onclick = section.ctaAction === 'pricing' ? openV17PricingFromLanding : startLanding;
    actionWrap.appendChild(action);
    sectionEl.appendChild(actionWrap);
  }
  return sectionEl;
}

function renderPricingPlanCard(planKey, plan) {

  appendPricingText(card, 'div', 'pricing-plan-tagline', plan.tagline);

  if (features.length) {
    var list = document.createElement('ul');
    list.className = 'pricing-feature-list';
    features.forEach(function(feature) {

      list.appendChild(item);

  button.className = planKey === 'free' ? 'btn-ghost' : 'btn';

  button.onclick = planKey === 'free' ? handleFreeStartAction : handlePricingPrimaryAction;
  button.textContent = planKey === 'free' ? plan.cta : getPricingAccountCtaLabel();
  card.appendChild(button);
  if (planKey === 'pro') {
    var status = document.createElement('div');
    status.className = 'pricing-soon';
    status.id = 't-pricing-soon';

  var section = document.createElement('section');
  section.className = 'pricing-comparison';
  appendPricingText(section, 'h2', 'pricing-section-title', pricing.comparison && pricing.comparison.title);
  var list = document.createElement('div');
  list.className = 'pricing-comparison-list';
  var items = pricing.comparison && Array.isArray(pricing.comparison.items) ? pricing.comparison.items : [];

  items.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'pricing-comparison-row';
    row.dataset.comparisonId = item.id || '';
    appendPricingText(row, 'div', 'pricing-comparison-label', item.label);
    var values = document.createElement('div');
    values.className = 'pricing-comparison-values';
    [
      { key: 'free', plan: pricing.plans && pricing.plans.free ? pricing.plans.free.name : '', value: item.free },
      { key: 'pro', plan: pricing.plans && pricing.plans.pro ? pricing.plans.pro.name : '', value: item.pro }
    ].forEach(function(entry) {
      var valueBox = document.createElement('div');
      valueBox.className = 'pricing-comparison-value';
      valueBox.setAttribute('aria-label', [item.label, entry.plan, entry.value].filter(Boolean).join(' '));
      appendPricingText(valueBox, 'span', 'pricing-comparison-plan', entry.plan);
      appendPricingText(valueBox, 'span', 'pricing-comparison-text', entry.value);

function handlePricingPrimaryAction() {
  if (typeof window.refreshV17BillingUIModel === 'function') {
    try { window.refreshV17BillingUIModel(); } catch (error) {}
  }
  if (typeof window.performV17BillingPrimaryAction === 'function') {
    var resultPromise = window.performV17BillingPrimaryAction({
      onAuthRequired: function() {
        openV17AuthModal();
      }
    });
    if (resultPromise && typeof resultPromise.then === 'function') {
      return resultPromise.then(function(result) {
        if (result && result.code === 'billing_core_unavailable') {
          if (typeof pricingCtaClick === 'function') return pricingCtaClick();
        }
        return result;
      }).catch(function() {
        return { ok: false, code: 'unknown_error' };
      });
    }
    if (resultPromise && resultPromise.code !== 'billing_core_unavailable') {
      return resultPromise;
    }
  }
  if (getAccountUIState() === 'plus' && typeof openCustomerPortal === 'function') {
    return openCustomerPortal();
  }
  if (typeof pricingCtaClick === 'function') return pricingCtaClick();
  return { ok: false, code: 'billing_core_unavailable' };
}

function handleV17PortalAction() {
  if (typeof window.refreshV17BillingUIModel === 'function') {
    try { window.refreshV17BillingUIModel(); } catch (error) {}
  }
  if (typeof window.openV17CustomerPortal === 'function') {
    return window.openV17CustomerPortal().then(function(result) {
      if (result && result.code !== 'billing_core_unavailable') {
        return result;
      }
      if (typeof window.getV17AccessSnapshot === 'function') {
        try {
          var snapshot = window.getV17AccessSnapshot();
          if (!snapshot || !snapshot.hasStripeCustomer || snapshot.billingState === 'unknown') {
            return result;
          }
        } catch (error) {
          return result;
        }
      }
      if (typeof openCustomerPortal === 'function') {
        return openCustomerPortal();
      }
      return result;
    }).catch(function() {
      return { ok: false, code: 'unknown_error' };
    });
  }
  if (typeof openCustomerPortal === 'function') {
    return openCustomerPortal();
  }
  return { ok: false, code: 'billing_core_unavailable' };
}

      D.finalThemeScore = score;
      D.afterEmotionPositive = score;
      D.v17Flow.finalThemeScore = score;

function renderWishAccordion() {
  var wrap = document.getElementById('wish-accordion');
  if (!wrap) return;
  clearChildren(wrap);
  wishThemeVisibleCounts = {};

  for (var i = 0; i < wishGroups.length; i++) {
    var cat = wishGroups[i];
    var section = document.createElement('div');
    section.className = 'theme-section wish-category';
    section.id = 'wish-cat-' + cat.id;

    var header = document.createElement('button');
    header.className = 'theme-section-header';
    header.onclick = (function(id){ return function(){ toggleWishCategory(id); }; })(cat.id);
    var labelWrap = document.createElement('span');
    labelWrap.className = 'theme-section-label-wrap';
    var label = document.createElement('span');
    label.className = 'theme-section-label';
    label.textContent = cat.label;
    labelWrap.appendChild(label);
    var toggle = document.createElement('span');
    toggle.className = 'theme-section-toggle';
    toggle.textContent = '＋';
    header.appendChild(labelWrap);
    header.appendChild(toggle);

    var body = document.createElement('div');

function toggleWishCategory(categoryId) {
  var el = document.getElementById('wish-cat-' + categoryId);
  if (!el) return;
  var isOpen = el.classList.toggle('wish-open');
  var tog = el.children[0] ? el.children[0].querySelector('.theme-section-toggle') : null;
  if (tog) tog.textContent = isOpen ? '－' : '＋';
  if (isOpen && el.children[1]) {
    var wishes = el.children[1].children;
    for (var i = 0; i < wishes.length; i++) {
      if (!wishes[i].classList || !wishes[i].classList.contains('wish-item')) continue;
      wishes[i].classList.remove('wish-open');
      var wishToggle = wishes[i].children[0] ? wishes[i].children[0].querySelector('.theme-section-toggle') : null;
      if (wishToggle) wishToggle.textContent = '＋';
    }
  }

function makeWishSection(category, wish) {
  var section = document.createElement('div');
  section.className = 'theme-section wish-item';
  section.id = 'wish-' + category.id + '-' + wish.id;

  var header = document.createElement('button');
  header.className = 'theme-section-header wish-child-row';
  header.onclick = (function(id){ return function(){ toggleWishThemeSection(id); }; })(section.id);
  var labelWrap = document.createElement('span');
  labelWrap.className = 'theme-section-label-wrap';
  var label = document.createElement('span');
  label.className = 'theme-section-label';
  label.textContent = wish.label;
  labelWrap.appendChild(label);
  var toggle = document.createElement('span');
  toggle.className = 'theme-section-toggle';
  toggle.textContent = '＋';
  header.appendChild(labelWrap);
  header.appendChild(toggle);

  var body = document.createElement('div');
  body.className = 'theme-section-body wish-item-body';
  var grid = document.createElement('div');
  grid.className = 'theme-grid';
  grid.id = 'wish-theme-grid-' + category.id + '-' + wish.id;
  grid.style.marginTop = '.5rem';
  grid.style.marginBottom = '.4rem';
  var key = category.id + ':' + wish.id;
  wishThemeVisibleCounts[key] = 2;
  body.appendChild(grid);
  var more = document.createElement('button');
  more.className = 'btn-see-more';
  more.id = 'wish-theme-more-' + category.id + '-' + wish.id;
  more.textContent = getText('ui.seeMore', 'さらに見る');

    return function() { seeMoreWishThemes(categoryId, wishId); };
  })(category.id, wish.id);
  body.appendChild(more);
  section.appendChild(header);
  section.appendChild(body);

    grid.appendChild(makeWishThemeButton(category, wish, themes[i], i));
  }
  more.style.display = visible < themes.length ? '' : 'none';
  return section;
}

function makeWishThemeButton(category, wish, theme, index) {
  var themeLabel = typeof theme === 'string' ? theme : theme.label;
  var btn = document.createElement('button');
  btn.className = 'theme-btn';
  var ls = document.createElement('span');
  ls.className = 'theme-btn-label';
  ls.textContent = themeLabel;

function renderWishThemeItems(category, wish) {
  var grid = document.getElementById('wish-theme-grid-' + category.id + '-' + wish.id);
  var more = document.getElementById('wish-theme-more-' + category.id + '-' + wish.id);
  if (!grid || !more) return;
  clearChildren(grid);
  var themes = getWishThemes(category.id, wish.id);
  var key = category.id + ':' + wish.id;
  var visible = Math.min(wishThemeVisibleCounts[key] || 2, themes.length);
  for (var i = 0; i < visible; i++) {
    var theme = themes[i];
    var themeLabel = typeof theme === 'string' ? theme : theme.label;
    if (!themeLabel) continue;
    grid.appendChild(makeWishThemeButton(category, wish, theme, i));
  }
  more.style.display = visible < themes.length ? '' : 'none';
}

function seeMoreWishThemes(categoryId, wishId) {
  var category = null;
  var wish = null;
  var wishGroups = getWishGroups();
  for (var i = 0; i < wishGroups.length; i++) {
    if (wishGroups[i].key !== categoryId) continue;
    category = wishGroups[i];
    for (var j = 0; j < category.wishes.length; j++) {
      if (category.wishes[j].id === wishId) { wish = category.wishes[j]; break; }
    }
    break;
  }
  if (!category || !wish) return;
  var key = categoryId + ':' + wishId;
  wishThemeVisibleCounts[key] = (wishThemeVisibleCounts[key] || 2) + 2;
  renderWishThemeItems(category, wish);
}

function toggleWishThemeSection(sectionId) {
  var el = document.getElementById(sectionId);
  if (!el) return;
  var wasOpen = el.classList.contains('wish-open');
  var siblings = el.parentElement ? el.parentElement.children : [];
  for (var i = 0; i < siblings.length; i++) {
    if (!siblings[i].classList || !siblings[i].classList.contains('wish-item')) continue;
    siblings[i].classList.remove('wish-open');
    var siblingToggle = siblings[i].children[0] ? siblings[i].children[0].querySelector('.theme-section-toggle') : null;
    if (siblingToggle) siblingToggle.textContent = '＋';
  }
  if (!wasOpen) el.classList.add('wish-open');
  var isOpen = !wasOpen;
  var tog = el.children[0] ? el.children[0].querySelector('.theme-section-toggle') : null;
  if (tog) tog.textContent = isOpen ? '－' : '＋';
  if (isOpen) {
    var parts = sectionId.replace('wish-', '').split('-');
    var categoryId = parts.shift();
    var wishId = parts.join('-');
    wishThemeVisibleCounts[categoryId + ':' + wishId] = 2;
    var category = null;
    var wish = null;
    var wishGroups = getWishGroups();
    for (var c = 0; c < wishGroups.length; c++) {
      if (wishGroups[c].key !== categoryId) continue;
      category = wishGroups[c];
      for (var w = 0; w < category.wishes.length; w++) {
        if (category.wishes[w].id === wishId) { wish = category.wishes[w]; break; }
      }
      break;
    }
    if (category && wish) renderWishThemeItems(category, wish);
  }
}

function getWishThemes(categoryId, wishId) {
  var wish = findWish(categoryId, wishId);
  return wish && wish.themes ? wish.themes : [];
}

function selectWishTheme(category, wish, theme, index) {
  var themeLabel = typeof theme === 'string' ? theme : (theme && theme.label);
  if (!category || !wish || !themeLabel) return;
  var groupKey = category.key || category.id;
  var wishKey = wish.key || wish.id;
  var themeKey = theme && theme.key ? theme.key : 'wish_' + groupKey + '_' + wishKey + '_' + (index + 1);
  D.themeKey      = themeKey;
  D.theme         = themeLabel;
  D.themePositive = themeLabel;
  D.themeNegative = theme.negative || '';
  D.themeMeaning  = theme.desc || '';
  D.selectedWishGroup = groupKey;
  D.selectedWish = wishKey;
  D.selectedWishTheme = theme && theme.key ? theme.key : '';
  D.v13InitialTheme = '';
  v12Invalidates  = D.themeNegative;
  themeChosen = true;
  resetV17SessionModeSelection();
  startSession();
}

function makeThemeBtn(id, label, extraClass) {
  var b = document.createElement('button');
  b.className = 'theme-btn' + (extraClass ? ' ' + extraClass : '') + (id === D.themeKey && themeChosen ? ' selected' : '');
  var desc = getThemeDesc(id);

    var ls = document.createElement('span'); ls.className = 'theme-btn-label'; ls.textContent = label;

    b.textContent = label;

  b.dataset.themeLabel = label;
  b.onclick = (function(k, lbl){ return function(){ selectTheme(k, lbl); }; })(id, label);

function getV17ThemeLibraryLocale() {
  if (lang === 'ja' || lang === 'zh-TW') return lang;
  return 'en';
}

function getV17SpiritualWisdomLocale() {
  return getV17ThemeLibraryLocale();
}

function isValidV17SpiritualWisdomLibrary(data) {
  if (!data || data.libraryId !== 'spiritual-wisdom' || !Array.isArray(data.groups)) return false;
  if (!data.label || !data.intro || !data.selectionNote) return false;
  return data.groups.every(function(group) {
    return group && group.id && group.label && Array.isArray(group.themes)
      && group.themes.every(function(theme) {
        return theme && theme.id && theme.label && theme.description;
      });
  });
}

function loadV17SpiritualWisdomLibrary() {
  var locale = getV17SpiritualWisdomLocale();
  if (v17SpiritualWisdomCache[locale]) {
    v17SpiritualWisdomLocale = locale;
    v17SpiritualWisdomData = v17SpiritualWisdomCache[locale];
    v17SpiritualWisdomError = '';
    renderV17SpiritualWisdomScreen();
    return Promise.resolve(v17SpiritualWisdomData);
  }
  if (v17SpiritualWisdomPromise && v17SpiritualWisdomLocale === locale) return v17SpiritualWisdomPromise;
  v17SpiritualWisdomLocale = locale;
  v17SpiritualWisdomError = '';
  renderV17SpiritualWisdomScreen();
  v17SpiritualWisdomPromise = fetch('./v17/data/spiritual-wisdom-' + locale + '.json')
    .then(function(response) {
      if (!response.ok) throw new Error('spiritual wisdom fetch failed');
      return response.json();
    })
    .then(function(data) {
      if (!isValidV17SpiritualWisdomLibrary(data)) throw new Error('invalid spiritual wisdom library');
      v17SpiritualWisdomCache[locale] = data;
      if (v17SpiritualWisdomLocale === locale) v17SpiritualWisdomData = data;
      return data;
    })
    .catch(function(error) {
      v17SpiritualWisdomError = error && error.message ? error.message : 'spiritual wisdom error';
      if (v17SpiritualWisdomLocale === locale) v17SpiritualWisdomData = null;
      return null;
    })
    .finally(function() {
      v17SpiritualWisdomPromise = null;
      renderV17SpiritualWisdomScreen();
    });
  return v17SpiritualWisdomPromise;
}

function isValidV17ThemeLibrary(data) {
  if (!data || !Array.isArray(data.categories) || data.categories.length !== 8) return false;
  return data.categories.every(function(category) {
    return category && category.id && category.label && Array.isArray(category.tracks)
      && category.tracks.length === 2
      && category.tracks.every(function(track) {
        return track && track.id && track.label && Array.isArray(track.themes)
          && track.themes.length > 0
          && track.themes.every(function(theme) { return theme && theme.id && theme.label; });
      });
  });
}

function loadV17ThemeLibrary() {
  var locale = getV17ThemeLibraryLocale();
  if (v17ThemeLibraryCache[locale]) {
    v17ThemeLibraryLocale = locale;
    v17ThemeLibraryData = v17ThemeLibraryCache[locale];
    v17ThemeLibraryError = '';
    renderV17ThemeAccordion();
    return Promise.resolve(v17ThemeLibraryData);
  }
  if (v17ThemeLibraryPromise && v17ThemeLibraryLocale === locale) return v17ThemeLibraryPromise;
  v17ThemeLibraryLocale = locale;
  v17ThemeLibraryError = '';
  renderV17ThemeAccordion();
  v17ThemeLibraryPromise = fetch('./v17/data/theme-library-' + locale + '.json')
    .then(function(response) {
      if (!response.ok) throw new Error('theme library fetch failed');
      return response.json();
    })
    .then(function(data) {
      if (!isValidV17ThemeLibrary(data)) throw new Error('invalid theme library');
      v17ThemeLibraryCache[locale] = data;
      if (v17ThemeLibraryLocale === locale) v17ThemeLibraryData = data;
      return data;
    })
    .catch(function(error) {
      v17ThemeLibraryError = error && error.message ? error.message : 'theme library error';
      if (v17ThemeLibraryLocale === locale) v17ThemeLibraryData = null;
      return null;
    })
    .finally(function() {
      v17ThemeLibraryPromise = null;
      renderV17ThemeAccordion();
    });
  return v17ThemeLibraryPromise;
}

function appendV17SpiritualThemePage(group, themeList, moreButton) {
  var library = v17SpiritualWisdomData;
  if (!library || !group || !Array.isArray(group.themes)) return;
  var pageSize = Math.max(1, Number(library.pageSize) || 4);
  var currentCount = v17SpiritualVisibleCounts[group.id] || pageSize;
  var nextCount = Math.min(currentCount + pageSize, group.themes.length);
  v17SpiritualVisibleCounts[group.id] = nextCount;
  renderV17SpiritualGroupThemes(group, themeList, moreButton);
}

function renderV17SpiritualGroupThemes(group, themeList, moreButton) {
  var library = v17SpiritualWisdomData;
  if (!library || !themeList || !moreButton || !group || !Array.isArray(group.themes)) return;
  var pageSize = Math.max(1, Number(library.pageSize) || 4);
  var visibleCount = Math.min(v17SpiritualVisibleCounts[group.id] || pageSize, group.themes.length);
  v17SpiritualVisibleCounts[group.id] = visibleCount;
  clearChildren(themeList);
  group.themes.slice(0, visibleCount).forEach(function(theme) {
    themeList.appendChild(createV17SpiritualThemeButton(group, theme));
  });
  moreButton.textContent = library.showMoreLabel || v17Copy('theme.showMore');
  moreButton.style.display = visibleCount < group.themes.length ? '' : 'none';
}

function createV17SpiritualGroupSection(group) {
  var groupWrap = document.createElement('section');
  groupWrap.className = 'v17-category' + (v17SpiritualOpenGroupId === group.id ? ' open' : '');
  groupWrap.dataset.groupId = group.id;

  groupLabel.textContent = group.label || '';

  groupMark.textContent = v17SpiritualOpenGroupId === group.id ? '－' : '＋';
  groupButton.appendChild(groupLabel);
  groupButton.appendChild(groupMark);
  var groupBody = document.createElement('div');
  groupBody.className = 'v17-category-body';
  var themeList = document.createElement('div');
  themeList.className = 'v17-theme-list';
  var moreButton = document.createElement('button');

  moreButton.className = 'btn-see-more v17-theme-more';
  moreButton.onclick = function() {
    appendV17SpiritualThemePage(group, themeList, moreButton);

  groupBody.appendChild(moreButton);
  groupButton.onclick = function() {

function bindV17FreeInputEnterGuard(input) {
  if (!input) return;
  var composing = false;
  input.addEventListener('compositionstart', function() {
    composing = true;
  });
  input.addEventListener('compositionend', function() {
    composing = false;
  });
  input.addEventListener('keydown', function(event) {
    if (event.key !== 'Enter') return;
    if (event.isComposing || event.keyCode === 229 || composing) return;
    if (input.tagName === 'TEXTAREA') return;
    event.preventDefault();
    event.stopPropagation();
  });
}

function loadV17FlowCopy() {
  if (v17FlowCopyPromise) return v17FlowCopyPromise;
  v17FlowCopyError = '';
  v17FlowCopyPromise = fetch('./v17/data/noetune-v17-flow.json')
    .then(function(response) {
      if (!response.ok) throw new Error('v17 flow copy fetch failed');
      return response.json();
    })
    .then(function(data) {
      if (!data || data.appVersion !== 'v17' || !Array.isArray(data.sequence)) {
        throw new Error('invalid v17 flow definition');
      }
      v17FlowCopyData = data;
      return data;
    })
    .catch(function(error) {
      v17FlowCopyError = error && error.message ? error.message : 'v17 flow copy error';
      v17FlowCopyData = null;
      return null;
    })
    .finally(function() {
      renderThemeScreen();
      renderCurrentV17Screen();
    });
  return v17FlowCopyPromise;
}

}

function v17Value(path) {

  return localeValue !== undefined && localeValue !== null ? localeValue : '';

  Object.keys(variables || {}).forEach(function(key) {
    text = text.split('{' + key + '}').join(String(variables[key] == null ? '' : variables[key]));

    meta: 'flow.step0.available',
    more: 'flow.step0.more'
  };
  return paths[key] ? v17Copy(paths[key]) : '';
}

  };

function createV17MeasurementStatePhase(state, value, touched) {
  return {
    state: state || 'unset',
    value: typeof value === 'number' ? value : null,
    touched: !!touched
  };
}

function ensureV17MeasurementState() {
  ensureV17SessionState();
  if (!D.v17MeasurementState || typeof D.v17MeasurementState !== 'object') {
    D.v17MeasurementState = {
      before: createV17MeasurementStatePhase('unset', null, false),
      after: createV17MeasurementStatePhase('unset', null, false)
    };
  }
  if (!D.v17MeasurementState.before || typeof D.v17MeasurementState.before !== 'object') {
    D.v17MeasurementState.before = createV17MeasurementStatePhase('unset', null, false);
  }
  if (!D.v17MeasurementState.after || typeof D.v17MeasurementState.after !== 'object') {
    D.v17MeasurementState.after = createV17MeasurementStatePhase('unset', null, false);
  }
  ['before', 'after'].forEach(function(kind) {
    var entry = D.v17MeasurementState[kind];
    if (typeof entry.state !== 'string') entry.state = 'unset';
    if (entry.state !== 'scored') {
      entry.value = null;
    } else if (typeof entry.value !== 'number' || Number.isNaN(entry.value)) {
      entry.value = null;
    }
    entry.touched = !!entry.touched;
  });
  return D.v17MeasurementState;
}

function resetV17MeasurementState() {
  D.v17MeasurementState = {
    before: createV17MeasurementStatePhase('unset', null, false),
    after: createV17MeasurementStatePhase('unset', null, false)
  };
  return D.v17MeasurementState;
}

function setV17MeasurementState(kind, state, value, touched) {
  var measurementState = ensureV17MeasurementState();
  if (!measurementState[kind]) {
    measurementState[kind] = createV17MeasurementStatePhase('unset', null, false);
  }
  measurementState[kind].state = state || 'unset';
  measurementState[kind].value = typeof value === 'number' ? value : null;
  measurementState[kind].touched = !!touched;
  return measurementState[kind];
}

function syncV17MeasurementStateFromValue(kind, value) {
  if (value === V17_SCORE_NOT_A_PROBLEM) {
    return setV17MeasurementState(kind, 'not_a_problem', null, true);
  }
  if (typeof value === 'number' && !Number.isNaN(value)) {
    return setV17MeasurementState(kind, 'scored', value, true);
  }
  return ensureV17MeasurementState()[kind];
}

function isHCQExcludedRange(id) {
  var match = /^HCQ-(\d{4})$/.exec(String(id || '').trim());
  if (!match) return true;
  var numericId = Number(match[1]);
  return numericId >= 901 && numericId <= 1000;
}

function isNormalHCQQuestion(question) {
  if (!question || typeof question !== 'object') return false;
  if (question.visibleInLibrary !== true) return false;
  if (typeof question.riskLevel !== 'number' || question.riskLevel > 2) return false;
  if (isHCQExcludedRange(question.id)) return false;
  if (!question.id || !question.question) return false;
  return true;
}

function normalizeHCQQuestion(question) {
  if (!question || typeof question !== 'object') return null;
  if (!question.id || !question.question) return null;
  var searchParts = [String(question.question)];
  if (Array.isArray(question.tags)) {
    question.tags.forEach(function(tag) {
      if (tag !== null && tag !== undefined && String(tag).trim()) {
        searchParts.push(String(tag));
      }
    });
  }
  if (Array.isArray(question.keywords)) {
    question.keywords.forEach(function(keyword) {
      if (keyword !== null && keyword !== undefined && String(keyword).trim()) {
        searchParts.push(String(keyword));
      }
    });
  } else if (typeof question.keywords === 'string' && question.keywords.trim()) {
    searchParts.push(question.keywords);
  }
  return {
    id: String(question.id),
    question: String(question.question),
    searchText: searchParts.join('\n').toLowerCase()
  };
}

function getV17QuestionSnapshot() {
  ensureV17QuestionState();
  if (!D.questionTextAtTime) return null;
  return {
    questionId: D.questionId || null,
    themeId: D.themeId || null,
    questionTextAtTime: D.questionTextAtTime,
    localeAtTime: D.localeAtTime || lang || 'ja',
    freeInputTheme: D.freeInputTheme || '',
    themeSource: D.themeSource || (D.questionId ? 'hcq' : 'freeInput'),
    themeCategoryId: D.themeCategoryId || '',
    themeCategoryLabelAtTime: D.themeCategoryLabelAtTime || '',
    themeTrackId: D.themeTrackId || '',
    themeMeaning: D.themeMeaning || '',
    sessionMode: D.v17SessionMode || null
  };
}

function loadV17QuestionCatalog() {
  if (v17QuestionLoadPromise) return v17QuestionLoadPromise;
  v17QuestionLoadError = '';
  v17QuestionLoadPromise = fetch('./v17/data/human-core-questions-v1.json')
    .then(function(response) {
      if (!response.ok) throw new Error('hcq fetch failed');
      return response.json();
    })
    .then(function(data) {
      if (!data || !Array.isArray(data.questions)) throw new Error('invalid hcq json');
      v17QuestionCatalogLocale = typeof data.locale === 'string' && data.locale.trim() ? data.locale.trim() : 'ja';
      var allQuestions = data.questions.map(normalizeHCQQuestion).filter(Boolean);
      var filtered = [];
      var excludedCount = 0;
      var index = {};
      data.questions.forEach(function(raw) {
        if (isHCQExcludedRange(raw && raw.id)) excludedCount += 1;
        if (!isNormalHCQQuestion(raw)) return;
        var normalized = normalizeHCQQuestion(raw);
        if (!normalized || index[normalized.id]) return;
        index[normalized.id] = normalized;
        filtered.push(normalized);
      });
      v17QuestionCatalog = filtered;
      v17QuestionIndex = index;
      v17QuestionLoadedCount = allQuestions.length;
      v17QuestionVisibleCount = filtered.length;
      v17ExcludedRangeCount = excludedCount;
      return filtered;
    })
    .catch(function(error) {
      v17QuestionLoadError = error && error.message ? error.message : 'unknown hcq error';
      v17QuestionCatalog = [];
      v17QuestionIndex = {};
      v17QuestionLoadedCount = 0;
      v17QuestionVisibleCount = 0;
      v17ExcludedRangeCount = 0;
      return [];
    })
    .finally(function() {
      renderThemeScreen();
    });
  renderThemeScreen();
  return v17QuestionLoadPromise;
}

function getVisibleHCQPool() {
  var query = (v17QuestionSearchValue || '').trim().toLowerCase();
  if (!query) return v17QuestionCatalog.slice();
  return v17QuestionCatalog.filter(function(question) {
    return question.searchText.indexOf(query) >= 0;
  });
}

function syncSelectedHCQUI() {
  var selectedWrap = document.getElementById('hcq-selected');
  var selectedText = document.getElementById('hcq-selected-text');
  if (!selectedWrap || !selectedText) return;
  ensureV17QuestionState();
  if (D.questionTextAtTime) {
    selectedWrap.classList.add('show');
    selectedText.textContent = D.questionTextAtTime;
  } else {
    selectedWrap.classList.remove('show');
    selectedText.textContent = '';
  }

function renderHCQList() {
  var list = document.getElementById('hcq-library-list');
  var status = document.getElementById('hcq-status');
  var meta = document.getElementById('hcq-meta-line');
  var more = document.getElementById('btn-see-more');
  if (!list || !status || !meta || !more) return;
  clearChildren(list);
  status.textContent = '';
  meta.textContent = v17Format('flow.step0.available', { count: v17QuestionVisibleCount });
  if (v17QuestionLoadError) {
    status.textContent = v17ThemeText('error');
    more.style.display = 'none';
    return;
  }
  if (!v17QuestionLoadPromise) {
    status.textContent = v17ThemeText('loading');
    more.style.display = 'none';
    return;
  }
  if (!v17QuestionCatalog.length && !v17QuestionLoadedCount) {
    status.textContent = v17ThemeText('loading');
    more.style.display = 'none';
    return;
  }
  var pool = getVisibleHCQPool();
  if (!pool.length) {
    status.textContent = v17ThemeText('empty');
    more.style.display = 'none';
    return;
  }
  var visibleCount = Math.min(themeVisibleCount, pool.length);
  for (var i = 0; i < visibleCount; i++) {
    var question = pool[i];
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'hcq-question-btn' + (D.themeKey === question.id && themeChosen ? ' selected' : '');
    button.textContent = question.question;
    button.dataset.themeKey = question.id;
    button.dataset.themeLabel = question.question;
    button.onclick = (function(record) {
      return function() { selectHCQQuestion(record); };
    })(question);
    list.appendChild(button);
  }
  more.style.display = visibleCount < pool.length ? '' : 'none';
  more.textContent = v17ThemeText('more');
}

function handleSituationBack() {
  if (situationStep === 'theme') {
    renderRelatedCategoryScreen(currentSituationSmallTitle, currentSituationMajorKey, currentSituationMiddleKey);
    return true;
  }
  if (situationStep === 'related') {
    if (currentSituationMiddleKey) renderSituationSmallScreen(currentSituationMajorKey, currentSituationMiddleKey);
    else renderSituationMiddleScreen(currentSituationMajorKey);
    return true;
  }
  if (situationStep === 'small') {
    renderSituationMiddleScreen(currentSituationMajorKey);
    return true;
  }
  if (situationStep === 'middle') {
    renderSituationMajorScreen();
    return true;
  }
  if (situationStep === 'major') {
    situationStep = null;
    v12Mode = '';
    fwd('s-entry-choice');
    return true;
  }
  return false;
}

function renderSituationMajorScreen() {

  for (var i = 0; i < V13_SITUATION_FLOW.length; i++) {
    var major = V13_SITUATION_FLOW[i];
    wrap.appendChild(makeSituationNavRow(major.label, major.desc || '', (function(key) {
      return function() { renderSituationMiddleScreen(key); };
    })(major.key)));

}

function renderSituationMiddleScreen(majorKey) {
  var accordion = document.getElementById('v12-situation-accordion');
  if (!accordion) return;
  clearChildren(accordion);
  var major = getSituationMajor(majorKey);
  if (!major) { renderSituationMajorScreen(); return; }
  situationStep = 'middle';
  currentSituationMajorKey = majorKey;
  currentSituationMiddleKey = null;
  currentSituationSmallTitle = '';
  currentSituationCategoryId = null;

  if (major.leaves && major.leaves.length > 0) {
    appendSituationHeader(accordion, major.label, 'トピックを選んでください。');
    var directWrap = document.createElement('div');
    directWrap.className = 'situation-list';
    for (var d = 0; d < major.leaves.length; d++) {
      var directLeaf = major.leaves[d];
      directWrap.appendChild(makeSituationNavRow(directLeaf, '', (function(title) {
        return function() { renderRelatedCategoryScreen(title, majorKey, ''); };
      })(directLeaf)));
    }
    accordion.appendChild(directWrap);
    appendSituationBack(accordion, '大カテゴリに戻る', renderSituationMajorScreen);
    return;
  }

  appendSituationHeader(accordion, major.label, '中カテゴリを選んでください。');

  var wrap = document.createElement('div');
  wrap.className = 'situation-list';
  var middles = major.middles || [];
  for (var i = 0; i < middles.length; i++) {
    var middle = middles[i];

function renderSituationSmallScreen(majorKey, middleKey) {

function renderRelatedCategoryScreen(topicTitle, majorKey, middleKey) {
  var accordion = document.getElementById('v12-situation-accordion');
  if (!accordion) return;
  clearChildren(accordion);

  currentSituationSmallTitle = topicTitle || '';
  currentSituationMajorKey = majorKey || '';
  currentSituationMiddleKey = middleKey || '';
  currentSituationCategoryId = null;
  situationStep = 'related';
  appendSituationHeader(accordion, currentSituationSmallTitle, '関連テーマカテゴリを選んでください。');
  var backToTopicList = function() {
    if (currentSituationMiddleKey) renderSituationSmallScreen(currentSituationMajorKey, currentSituationMiddleKey);
    else if (currentSituationMajorKey) renderSituationMiddleScreen(currentSituationMajorKey);
    else renderSituationMajorScreen();
  };

  var ids = situationLeafCategoryIds[topicTitle] || [];
  if (ids.length < 1) {
    var empty = document.createElement('div');
    empty.className = 'theme-section-desc';
    empty.style.padding = '.6rem 0 1rem';
    empty.textContent = '準備中';
    accordion.appendChild(empty);
    appendSituationBack(accordion, 'トピックに戻る', backToTopicList);
    return;
  }

  var wrap = document.createElement('div');
  wrap.className = 'situation-list';
  for (var i = 0; i < ids.length; i++) {
    var category = getBeliefCategoryById(ids[i]);
    if (!category) continue;
    wrap.appendChild(makeSituationNavRow(category.title, '', (function(cat) {
      return function() { renderSituationThemeScreen(cat.id, topicTitle, majorKey, middleKey); };
    })(category)));
  }
  accordion.appendChild(wrap);
  appendSituationBack(accordion, 'トピックに戻る', backToTopicList);
}

function renderSituationThemeScreen(categoryId, smallTitle, majorKey, middleKey) {
  var accordion = document.getElementById('v12-situation-accordion');
  if (!accordion) return;
  situationThemeVisibleCount = 2;
  currentSituationThemeItems = [];
  currentSituationSmallTitle = smallTitle || '';
  currentSituationMajorKey = majorKey || '';
  currentSituationMiddleKey = middleKey || '';
  currentSituationCategoryId = categoryId;
  situationStep = 'theme';
  var category = getBeliefCategoryById(categoryId);
  if (category) {
    var items = getThemeItems(category);
    for (var i = 0; i < items.length; i++) {
      currentSituationThemeItems.push({
        text: items[i],
        category: category,
        categoryTitle: category.title,
        smallTitle: currentSituationSmallTitle
      });
    }
  }

  renderSituationThemeItems();
}

function renderSituationThemeItems() {
  var accordion = document.getElementById('v12-situation-accordion');
  if (!accordion) return;
  clearChildren(accordion);

  appendSituationHeader(accordion, currentSituationSmallTitle, 'テーマを選んでください。');
  if (currentSituationThemeItems.length < 1) {
    var empty = document.createElement('div');
    empty.className = 'theme-section-desc';
    empty.style.padding = '.6rem 0 1rem';
    empty.textContent = '準備中';
    accordion.appendChild(empty);
    appendSituationBack(accordion, '関連テーマカテゴリに戻る', function() { renderRelatedCategoryScreen(currentSituationSmallTitle, currentSituationMajorKey, currentSituationMiddleKey); });
    return;
  }

  var grid = document.createElement('div');
  grid.className = 'theme-grid';
  grid.style.marginTop = '.35rem';
  grid.style.marginBottom = '.8rem';
  var visibleItems = currentSituationThemeItems.slice(0, situationThemeVisibleCount);
  for (var i = 0; i < visibleItems.length; i++) {
    var item = visibleItems[i];
    grid.appendChild(makeV13BeliefThemeBtn(item.text, item.category, item.smallTitle));
  }
  accordion.appendChild(grid);

  if (situationThemeVisibleCount < currentSituationThemeItems.length) {
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'btn-see-more';
    more.textContent = 'さらに見る';
    more.onclick = seeMoreSituationThemes;
    accordion.appendChild(more);
  }

  appendSituationBack(accordion, '関連テーマカテゴリに戻る', function() { renderRelatedCategoryScreen(currentSituationSmallTitle, currentSituationMajorKey, currentSituationMiddleKey); });
}

function seeMoreSituationThemes() {
  situationThemeVisibleCount += 2;
  renderSituationThemeItems();
}

function makeSituationBoxGroup(items, notice) {
  var wrap = document.createElement('div');
  wrap.className = 'situation-list';

  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.type === 'heading') {
      wrap.appendChild(makeSituationListHeading(item));
    } else if (item.children && item.children.length > 0) {
      wrap.appendChild(makeSituationSubgroup(item, notice));
    } else {
      wrap.appendChild(makeSituationComingSoonRow(item, notice));
    }
  }
  return wrap;
}

function makeSituationListHeading(item) {
  var heading = document.createElement('div');
  heading.className = 'situation-list-heading';
  heading.textContent = item.label;
  return heading;
}

function makeSituationSubgroup(item, notice) {
  var group = document.createElement('div');
  group.className = 'situation-subgroup';

  var header = document.createElement('button');
  header.type = 'button';
  header.className = 'situation-subgroup-header';

  var title = document.createElement('span');
  title.className = 'situation-subgroup-title';
  title.textContent = item.label;

  var toggle = document.createElement('span');
  toggle.className = 'situation-subgroup-toggle';
  toggle.textContent = '＋';

  header.appendChild(title);
  header.appendChild(toggle);

  var body = document.createElement('div');
  body.className = 'situation-subgroup-body';
  body.appendChild(makeSituationBoxGroup(item.children || [], notice));

  header.onclick = function() {
    var open = group.classList.toggle('open');
    toggle.textContent = open ? '－' : '＋';
  };

  group.appendChild(header);
  group.appendChild(body);
  return group;
}

function makeSituationComingSoonRow(item, notice) {
  var b = document.createElement('button');
  b.className = 'situation-row';
  b.type = 'button';

  var copy = document.createElement('span');
  copy.className = 'situation-row-copy';

  var ls = document.createElement('span');
  ls.className = 'situation-row-label';
  ls.textContent = item.label;
  copy.appendChild(ls);

  if (item.desc) {
    var sub = document.createElement('span');
    sub.className = 'situation-row-desc';
    sub.textContent = item.desc;
    copy.appendChild(sub);
  }

  var ds = document.createElement('span');
  ds.className = 'situation-row-status';
  ds.textContent = '選ぶ';

  b.appendChild(copy);
